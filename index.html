
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible — YLT / WEB</title>

  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --text: #111111;
      --muted: #777777;
    }

    body.dark {
      color-scheme: dark;
      --background: #000000;
      --text: #f5f5f5;
      --muted: #999999;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.15;
      transition: background 0.15s, color 0.15s;
    }

    #reader {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px;
    }

    .verse {
      margin: 0 0 2mm;
    }

    .reference {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 12px;
      margin-bottom: 2mm;
    }

    .sentence {
      margin: 0;
      padding: 0;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .same {
      margin-bottom: 2mm;
    }

    .comparison {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      column-gap: 8px;
      row-gap: 2mm;
      margin-bottom: 2mm;
      align-items: start;
    }

    .connector {
      width: 18px;
      height: 100%;
      min-height: 24px;
      overflow: visible;
    }

    .connector path {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ylt {
      grid-column: 2;
      grid-row: 1;
    }

    .web {
      grid-column: 2;
      grid-row: 2;
    }

    .comparison .connector {
      grid-column: 1;
      grid-row: 1 / 3;
    }

    .error {
      color: #c62828;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    @media (max-width: 500px) {
      #reader {
        padding: 12px;
      }

      body {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main id="reader">Loading Bible...</main>

  <script>
    const reader = document.getElementById("reader");

    // Change to "dark" for a black background by default.
    const DEFAULT_THEME = "light";

    if (DEFAULT_THEME === "dark") {
      document.body.classList.add("dark");
    }

    function parseBibleFile(contents) {
      const verses = new Map();

      for (const line of contents.split(/\r?\n/)) {
        // Format: Genesis 1:1<TAB>Verse text
        const match = line.match(/^(.+?)\s+(\d+:\d+)\t(.*)$/);

        if (!match) continue;

        const [, book, chapterVerse, text] = match;
        const reference = `${book} ${chapterVerse}`;

        verses.set(reference, text.trim());
      }

      return verses;
    }

    function splitSentences(text) {
      // Split at sentence-ending punctuation while keeping punctuation.
      // Avoid splitting at commas, semicolons, or colons.
      return (text.match(/[^.!?]+(?:[.!?]+["'’”)]*)*|[.!?]+/g) || [])
        .map(sentence => sentence.trim())
        .filter(Boolean);
    }

    function normalize(text) {
      return text
        .normalize("NFC")
        .replace(/[‘’]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[—–]/g, "-")
        .replace(/[.,;:!?'"()\-]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function makeConnector() {
      const svg = document.createElementNS(
        "http://www.w3.org/2000/svg", "svg"
      );

      svg.setAttribute("class", "connector");
      svg.setAttribute("viewBox", "0 0 18 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      // Upper path: right, up, right.
      const upper = document.createElementNS(
        "http://www.w3.org/2000/svg", "path"
      );
      upper.setAttribute("d", "M1 35 H7 V20 H17");

      // Mirrored lower path: right, down, right.
      const lower = document.createElementNS(
        "http://www.w3.org/2000/svg", "path"
      );
      lower.setAttribute("d", "M1 65 H7 V80 H17");

      svg.append(upper, lower);
      return svg;
    }

    // Align sentences in order so identical sentences can be shown once.
    function alignSentences(yltText, webText) {
      const a = splitSentences(yltText);
      const b = splitSentences(webText);
      const na = a.map(normalize);
      const nb = b.map(normalize);

      // Longest common subsequence finds identical sentences in both versions.
      const dp = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
      );

      for (let i = a.length - 1; i >= 0; i--) {
        for (let j = b.length - 1; j >= 0; j--) {
          dp[i][j] = na[i] === nb[j]
            ? 1 + dp[i + 1][j + 1]
            : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }

      const result = [];
      let i = 0;
      let j = 0;

      while (i < a.length && j < b.length) {
        if (na[i] === nb[j]) {
          result.push({ type: "same", text: a[i] });
          i++;
          j++;
        } else {
          const startI = i;
          const startJ = j;

          // Collect the differing sentences until the next shared sentence.
          while (
            i < a.length &&
            j < b.length &&
            na[i] !== nb[j]
          ) {
            if (dp[i + 1][j] >= dp[i][j + 1]) {
              i++;
            } else {
              j++;
            }
          }

          const yltPart = a.slice(startI, i);
          const webPart = b.slice(startJ, j);

          if (yltPart.length || webPart.length) {
            result.push({
              type: "different",
              ylt: yltPart.join(" "),
              web: webPart.join(" ")
            });
          }
        }
      }

      if (i < a.length || j < b.length) {
        result.push({
          type: "different",
          ylt: a.slice(i).join(" "),
          web: b.slice(j).join(" ")
        });
      }

      return result;
    }

    function renderVerse(reference, yltText, webText) {
      const verse = makeElement("section", "verse");
      verse.appendChild(makeElement("div", "reference", reference));

      if (yltText === undefined || webText === undefined) {
        verse.appendChild(makeElement(
          "p",
          "sentence",
          yltText ?? webText ?? ""
        ));
        return verse;
      }

      const sentences = alignSentences(yltText, webText);

      for (const sentence of sentences) {
        if (sentence.type === "same") {
          verse.appendChild(
            makeElement("p", "sentence same", sentence.text)
          );
          continue;
        }

        const comparison = makeElement("div", "comparison");
        comparison.appendChild(makeConnector());

        if (sentence.ylt) {
          comparison.appendChild(
            makeElement("p", "sentence ylt", sentence.ylt)
          );
        }

        if (sentence.web) {
          comparison.appendChild(
            makeElement("p", "sentence web", sentence.web)
          );
        }

        verse.appendChild(comparison);
      }

      return verse;
    }

    async function startReader() {
      try {
        const [yltResponse, webResponse] = await Promise.all([
          fetch("./YLT.txt"),
          fetch("./WEB.txt")
        ]);

        if (!yltResponse.ok || !webResponse.ok) {
          throw new Error(
            "Could not load YLT.txt or WEB.txt. Check that both files are in this folder."
          );
        }

        const [yltContents, webContents] = await Promise.all([
          yltResponse.text(),
          webResponse.text()
        ]);

        const ylt = parseBibleFile(yltContents);
        const web = parseBibleFile(webContents);

        const references = [...new Set([
          ...ylt.keys(),
          ...web.keys()
        ])];

        const fragment = document.createDocumentFragment();

        for (const reference of references) {
          fragment.appendChild(
            renderVerse(
              reference,
              ylt.get(reference),
              web.get(reference)
            )
          );
        }

        reader.replaceChildren(fragment);
      } catch (error) {
        reader.replaceChildren(
          makeElement("p", "error", error.message)
        );
      }
    }

    startReader();
  </script>
</body>
</html>
