
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bible — YLT &amp; WEB</title>

  <style>
    :root {
      --background: #ffffff;
      --text: #171717;
      --muted: #777777;
      --line: #888888;
    }

    body.dark {
      --background: #000000;
      --text: #f5f5f5;
      --muted: #999999;
      --line: #888888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      line-height: 1.2;
    }

    #reader {
      max-width: 900px;
      margin: 0 auto;
      padding: 6px;
    }

    /* Verses flow continuously instead of each starting a new line. */
    .verse {
      display: inline;
      margin: 0;
      padding: 0;
    }

    /* Small superscript-style reference: G1:2, Ex3:4, etc. */
    .reference {
      display: inline;
      position: relative;
      top: -0.25em;
      vertical-align: baseline;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.72em;
      white-space: nowrap;
      margin-right: 2px;
    }

    .sentence {
      display: inline;
      margin: 0;
      padding: 0;
      font-size: inherit;
      line-height: inherit;
      overflow-wrap: anywhere;
    }

    .same {
      display: inline;
    }

    /*
      Differing text is shown as two tightly stacked lines.
      YLT shifts right 2mm; WEB shifts left 2mm.
    */
    .comparison {
      display: inline-grid;
      grid-template-columns: minmax(0, 1fr);
      vertical-align: middle;
      position: relative;
      margin: 0 1px;
      padding: 0;
      gap: 0;
      max-width: 100%;
    }

    .ylt,
    .web {
      display: block;
      position: relative;
      font-size: inherit;
      line-height: 1.15;
      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 0.6px;
      text-underline-offset: 1px;
      overflow-wrap: anywhere;
    }

    .ylt {
      transform: translateX(2mm);
      width: calc(100% - 2mm);
      justify-self: start;
    }

    .web {
      transform: translateX(-2mm);
      width: calc(100% - 2mm);
      justify-self: end;
    }

    /* Rounded connector arrow between the two translations. */
    .connector {
      position: absolute;
      left: -1px;
      top: 50%;
      width: 12px;
      height: 18px;
      transform: translateY(-50%);
      overflow: visible;
      pointer-events: none;
      z-index: 2;
    }

    .connector path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .error {
      color: #d33;
      font-family: Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main id="reader">Loading Bible...</main>

  <script>
    "use strict";

    const reader = document.getElementById("reader");

    // Change to "dark" for a black background by default.
    const DEFAULT_THEME = "light";

    if (DEFAULT_THEME === "dark") {
      document.body.classList.add("dark");
    }

    const bookAbbreviations = {
      "Genesis": "G",
      "Exodus": "Ex",
      "Leviticus": "Le",
      "Numbers": "Nu",
      "Deuteronomy": "De",
      "Joshua": "Jos",
      "Judges": "Jdg",
      "Ruth": "Ru",
      "1 Samuel": "1Sa",
      "2 Samuel": "2Sa",
      "1 Kings": "1Ki",
      "2 Kings": "2Ki",
      "1 Chronicles": "1Ch",
      "2 Chronicles": "2Ch",
      "Ezra": "Ezr",
      "Nehemiah": "Ne",
      "Esther": "Es",
      "Job": "Job",
      "Psalms": "Ps",
      "Psalm": "Ps",
      "Proverbs": "Pr",
      "Ecclesiastes": "Ec",
      "Song of Solomon": "So",
      "Isaiah": "Isa",
      "Jeremiah": "Jer",
      "Lamentations": "La",
      "Ezekiel": "Eze",
      "Daniel": "Da",
      "Hosea": "Ho",
      "Joel": "Joe",
      "Amos": "Am",
      "Obadiah": "Ob",
      "Jonah": "Jon",
      "Micah": "Mic",
      "Nahum": "Na",
      "Habakkuk": "Hab",
      "Zephaniah": "Zep",
      "Haggai": "Hag",
      "Zechariah": "Zec",
      "Malachi": "Mal",
      "Matthew": "Mt",
      "Mark": "Mk",
      "Luke": "Lk",
      "John": "Jn",
      "Acts": "Ac",
      "Romans": "Ro",
      "1 Corinthians": "1Co",
      "2 Corinthians": "2Co",
      "Galatians": "Ga",
      "Ephesians": "Eph",
      "Philippians": "Php",
      "Colossians": "Col",
      "1 Thessalonians": "1Th",
      "2 Thessalonians": "2Th",
      "1 Timothy": "1Ti",
      "2 Timothy": "2Ti",
      "Titus": "Tit",
      "Philemon": "Phm",
      "Hebrews": "Heb",
      "James": "Jas",
      "1 Peter": "1Pe",
      "2 Peter": "2Pe",
      "1 John": "1Jn",
      "2 John": "2Jn",
      "3 John": "3Jn",
      "Jude": "Jud",
      "Revelation": "Re"
    };

    function shortReference(reference) {
      const match = reference.match(/^(.+?)\s+(\d+):(\d+)$/);

      if (!match) return reference;

      const [, book, chapter, verse] = match;
      const abbreviation = bookAbbreviations[book] || book;

      return `${abbreviation}${chapter}:${verse}`;
    }

    async function loadBibleFile(filename) {
      const response = await fetch(filename);

      if (!response.ok) {
        throw new Error(
          `Could not load ${filename}. Make sure it is beside index.html.`
        );
      }

      const contents = await response.text();
      const verses = new Map();

      for (const line of contents.split(/\r?\n/)) {
        const match = line.match(/^(.+?)\s+(\d+:\d+)\t(.*)$/);

        if (!match) continue;

        const [, book, chapterVerse, text] = match;
        verses.set(`${book} ${chapterVerse}`, text.trim());
      }

      return verses;
    }

    function normalize(text) {
      return text
        .normalize("NFC")
        .replace(/[‘’]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[—–]/g, "-")
        .replace(/[.,;:!?'"()[\]{}\-]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    // Split at sentence-ending punctuation, retaining the punctuation.
    function splitSentences(text) {
      const matches = text.match(
        /[^.!?]+(?:[.!?]+["'’”)]*)*|[.!?]+/g
      );

      return (matches || [])
        .map(sentence => sentence.trim())
        .filter(Boolean);
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;

      return element;
    }

    function makeConnector() {
      const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );

      svg.setAttribute("class", "connector");
      svg.setAttribute("viewBox", "0 0 12 18");
      svg.setAttribute("aria-hidden", "true");

      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      // Smooth, rounded turn toward the lower translation.
      path.setAttribute("d", "M1 1 H3 Q7 1 7 5 V13 Q7 17 11 17");

      const arrowhead = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      arrowhead.setAttribute("d", "M8 14 L11 17 L8 18");

      svg.append(path, arrowhead);

      return svg;
    }

    /*
      Identify identical sentences in order. Matching sentences are
      displayed once; unmatched sentences are displayed as a pair.
    */
    function alignSentences(yltText, webText) {
      const ylt = splitSentences(yltText);
      const web = splitSentences(webText);

      const a = ylt.map(normalize);
      const b = web.map(normalize);

      const dp = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
      );

      for (let i = a.length - 1; i >= 0; i--) {
        for (let j = b.length - 1; j >= 0; j--) {
          dp[i][j] = a[i] === b[j]
            ? 1 + dp[i + 1][j + 1]
            : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }

      const result = [];
      let i = 0;
      let j = 0;

      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) {
          result.push({
            type: "same",
            text: ylt[i]
          });

          i++;
          j++;
          continue;
        }

        const startI = i;
        const startJ = j;

        while (
          i < a.length &&
          j < b.length &&
          a[i] !== b[j]
        ) {
          if (dp[i + 1][j] >= dp[i][j + 1]) {
            i++;
          } else {
            j++;
          }
        }

        const yltPart = ylt.slice(startI, i);
        const webPart = web.slice(startJ, j);

        if (yltPart.length || webPart.length) {
          result.push({
            type: "different",
            ylt: yltPart.join(" "),
            web: webPart.join(" ")
          });
        }
      }

      if (i < a.length || j < b.length) {
        result.push({
          type: "different",
          ylt: ylt.slice(i).join(" "),
          web: web.slice(j).join(" ")
        });
      }

      return result;
    }

    function renderVerse(reference, yltText, webText) {
      const verse = makeElement("span", "verse");

      verse.appendChild(
        makeElement("sub", "reference", shortReference(reference))
      );

      if (yltText === undefined || webText === undefined) {
        verse.appendChild(
          makeElement("span", "sentence same", yltText ?? webText ?? "")
        );
        verse.appendChild(document.createTextNode(" "));
        return verse;
      }

      const aligned = alignSentences(yltText, webText);

      for (const item of aligned) {
        if (item.type === "same") {
          verse.appendChild(
            makeElement("span", "sentence same", item.text + " ")
          );
          continue;
        }

        const comparison = makeElement("span", "comparison");

        comparison.appendChild(makeConnector());

        if (item.ylt) {
          comparison.appendChild(
            makeElement("span", "sentence ylt", item.ylt)
          );
        }

        if (item.web) {
          comparison.appendChild(
            makeElement("span", "sentence web", item.web)
          );
        }

        verse.appendChild(comparison);
        verse.appendChild(document.createTextNode(" "));
      }

      return verse;
    }

    async function startReader() {
      try {
        const [ylt, web] = await Promise.all([
          loadBibleFile("./YLT.txt"),
          loadBibleFile("./WEB.txt")
        ]);

        const references = [
          ...new Set([...ylt.keys(), ...web.keys()])
        ];

        const fragment = document.createDocumentFragment();

        for (const reference of references) {
          fragment.appendChild(
            renderVerse(
              reference,
              ylt.get(reference),
              web.get(reference)
            )
          );
        }

        reader.replaceChildren(fragment);
      } catch (error) {
        reader.replaceChildren(
          makeElement("p", "error", error.message)
        );
      }
    }

    startReader();
  </script>
</body>
</html>
