<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Comparison</title>

<style>
:root {
  --background: #ffffff;
  --text: #171717;
  --muted: #777777;
  --ylt-color: #202020;
  --web-color: #202020;
  --connector: #888888;
}

body.dark {
  --background: #000000;
  --text: #eeeeee;
  --muted: #888888;
  --ylt-color: #eeeeee;
  --web-color: #eeeeee;
  --connector: #777777;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--background);
}

body {
  margin: 0;
  padding: 10px;
  background: var(--background);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 9px;
  line-height: 1.35;
  transition: background 0.15s, color 0.15s;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  margin-bottom: 8px;
  background: var(--background);
  border-bottom: 1px solid var(--muted);
  font-family: Arial, sans-serif;
}

.toolbar button,
.toolbar select,
.toolbar input {
  min-width: 0;
  padding: 5px;
  font-size: 11px;
  color: var(--text);
  background: var(--background);
  border: 1px solid var(--muted);
  border-radius: 5px;
}

.toolbar input {
  flex: 1;
}

#status {
  color: var(--muted);
  font-family: Arial, sans-serif;
  font-size: 10px;
  margin-bottom: 8px;
}

#bible {
  overflow-wrap: anywhere;
  white-space: normal;
}

/* Chapter headings stay compact. */
.chapter {
  display: inline;
  font-weight: bold;
  font-size: 1.15em;
  margin-right: 2px;
}

/* Small reference, similar to a superscript Bible reference. */
.reference {
  display: inline;
  font-size: 0.72em;
  vertical-align: super;
  color: var(--muted);
  margin-right: 1px;
  white-space: nowrap;
}

/* A matching sentence is shown once. */
.same {
  color: var(--text);
}

/*
  Each comparison is one inline unit.
  The top and bottom lines belong to the same unit, so following text
  flows after the bottom line instead of between the two translations.
*/
.comparison {
  display: inline-block;
  position: relative;
  vertical-align: baseline;
  max-width: 100%;
  margin: 0 1px;
  overflow: visible;
  line-height: 1;
}

.version {
  display: block;
  position: relative;
  width: 100%;
  font-size: 9px;
  line-height: 2mm;
  overflow-wrap: anywhere;
}

.ylt {
  color: var(--ylt-color);
  text-decoration-line: underline;
  text-decoration-style: dotted;
  text-decoration-color: #4386d6;
  text-underline-offset: 1px;
  transform: translateX(0.7mm);
}

.web {
  color: var(--web-color);
  text-decoration-line: underline;
  text-decoration-style: dotted;
  text-decoration-color: #d08a42;
  text-underline-offset: 1px;
  transform: translateX(-0.7mm);
}

/* Small curved connector indicating that the lines are a pair. */
.connector {
  position: absolute;
  left: -3px;
  top: 50%;
  width: 4px;
  height: 2mm;
  border-left: 1px solid var(--connector);
  border-bottom: 1px solid var(--connector);
  border-bottom-left-radius: 3px;
  pointer-events: none;
  opacity: 0.75;
}

#message {
  margin-top: 20px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: var(--muted);
}

/* Search results */
mark {
  background: #ffe68a;
  color: #111111;
}

/* Keep controls usable on small screens. */
@media (max-width: 480px) {
  body {
    padding: 7px;
    font-size: 9px;
  }

  .version {
    font-size: 9px;
    line-height: 2mm;
  }

  .toolbar {
    gap: 4px;
  }

  .toolbar button,
  .toolbar select {
    padding: 4px;
  }
}
</style>
</head>

<body>

<div class="toolbar">
  <strong>Bible</strong>

  <input
    id="search"
    type="search"
    placeholder="Find a verse (e.g. Genesis 1:2)"
    aria-label="Search Bible"
  >

  <button id="themeButton" type="button">Dark</button>
</div>

<div id="status">Loading Bible files…</div>
<div id="bible"></div>
<div id="message"></div>

<script>
"use strict";

/*
  Files expected beside this index.html:
    YLT.txt
    WEB.txt

  Expected line format:
    Genesis 1:1    In the beginning...
*/

const DEFAULT_THEME = "light";

const bible = document.getElementById("bible");
const status = document.getElementById("status");
const message = document.getElementById("message");
const search = document.getElementById("search");
const themeButton = document.getElementById("themeButton");

let yltVerses = new Map();
let webVerses = new Map();
let renderedVerses = [];
let currentBook = "";
let currentChapter = "";

/* Book names are converted into compact references. */
const bookAbbreviations = {
  "Genesis": "G",
  "Exodus": "Ex",
  "Leviticus": "Le",
  "Numbers": "Nu",
  "Deuteronomy": "De",
  "Joshua": "Jos",
  "Judges": "Jg",
  "Ruth": "Ru",
  "1 Samuel": "1S",
  "2 Samuel": "2S",
  "1 Kings": "1K",
  "2 Kings": "2K",
  "1 Chronicles": "1Ch",
  "2 Chronicles": "2Ch",
  "Ezra": "Ezr",
  "Nehemiah": "Ne",
  "Esther": "Es",
  "Job": "Job",
  "Psalms": "Ps",
  "Psalm": "Ps",
  "Proverbs": "Pr",
  "Ecclesiastes": "Ec",
  "Song of Solomon": "So",
  "Isaiah": "Isa",
  "Jeremiah": "Jer",
  "Lamentations": "La",
  "Ezekiel": "Eze",
  "Daniel": "Da",
  "Hosea": "Ho",
  "Joel": "Joe",
  "Amos": "Am",
  "Obadiah": "Ob",
  "Jonah": "Jon",
  "Micah": "Mic",
  "Nahum": "Na",
  "Habakkuk": "Hab",
  "Zephaniah": "Zep",
  "Haggai": "Hag",
  "Zechariah": "Zec",
  "Malachi": "Mal",
  "Matthew": "Mt",
  "Mark": "Mk",
  "Luke": "Lu",
  "John": "J",
  "Acts": "Ac",
  "Romans": "Ro",
  "1 Corinthians": "1Co",
  "2 Corinthians": "2Co",
  "Galatians": "Ga",
  "Ephesians": "Eph",
  "Philippians": "Php",
  "Colossians": "Col",
  "1 Thessalonians": "1Th",
  "2 Thessalonians": "2Th",
  "1 Timothy": "1Ti",
  "2 Timothy": "2Ti",
  "Titus": "Tit",
  "Philemon": "Phm",
  "Hebrews": "Heb",
  "James": "Jas",
  "1 Peter": "1Pe",
  "2 Peter": "2Pe",
  "1 John": "1J",
  "2 John": "2J",
  "3 John": "3J",
  "Jude": "Jud",
  "Revelation": "Re"
};

/*
  Parse lines such as:
  Genesis 1:1<TAB>In the beginning...
*/
function parseBible(text) {
  const verses = new Map();
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);

  for (const rawLine of lines) {
    const line = rawLine.trim();

    if (!line) continue;

    const match = line.match(
      /^(.+?)\s+(\d+):(\d+)\s+(.+)$/
    );

    if (!match) continue;

    const book = match[1].trim();
    const chapter = Number(match[2]);
    const verse = Number(match[3]);
    const content = match[4].trim();

    if (!content) continue;

    const key = `${book}|${chapter}|${verse}`;

    verses.set(key, {
      book,
      chapter,
      verse,
      text: content
    });
  }

  return verses;
}

/*
  Normalize typographic differences and whitespace before comparing.
  Punctuation and wording remain significant.
*/
function normalizeSentence(text) {
  return text
    .normalize("NFC")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

/*
  Split text into sentence-like units while retaining punctuation.
  This is a lightweight splitter rather than a full language parser.
*/
function splitSentences(text) {
  const cleaned = text.replace(/\s+/g, " ").trim();

  if (!cleaned) return [];

  const parts = cleaned.match(/[^.!?]+(?:[.!?]+["'”’)\]]*|$)/g);

  return (parts || [cleaned])
    .map(part => part.trim())
    .filter(Boolean);
}

/*
  If the sentence sequences are different, align them in order.
  Matching sentences are shown once; unmatched sentences show both.
*/
function alignSentences(yltText, webText) {
  const ylt = splitSentences(yltText);
  const web = splitSentences(webText);

  const a = ylt.map(normalizeSentence);
  const b = web.map(normalizeSentence);

  const rows = [];
  let i = 0;
  let j = 0;

  while (i < ylt.length && j < web.length) {
    if (a[i] === b[j]) {
      rows.push({
        type: "same",
        text: ylt[i]
      });
      i++;
      j++;
      continue;
    }

    /*
      Look ahead for the next sentence that matches.
      This keeps sentences in their original order.
    */
    let match = null;

    for (let di = 0; di <= 4 && i + di < ylt.length; di++) {
      for (let dj = 0; dj <= 4 && j + dj < web.length; dj++) {
        if (a[i + di] === b[j + dj]) {
          const distance = di + dj;

          if (!match || distance < match.distance) {
            match = { di, dj, distance };
          }
        }
      }
    }

    if (!match) {
      rows.push({
        type: "different",
        ylt: ylt.slice(i).join(" "),
        web: web.slice(j).join(" ")
      });

      i = ylt.length;
      j = web.length;
      break;
    }

    const yltOnly = ylt.slice(i, i + match.di);
    const webOnly = web.slice(j, j + match.dj);

    const max = Math.max(yltOnly.length, webOnly.length);

    for (let k = 0; k < max; k++) {
      rows.push({
        type: "different",
        ylt: yltOnly[k] || "",
        web: webOnly[k] || ""
      });
    }

    i += match.di;
    j += match.dj;
  }

  while (i < ylt.length) {
    rows.push({
      type: "different",
      ylt: ylt[i],
      web: ""
    });
    i++;
  }

  while (j < web.length) {
    rows.push({
      type: "different",
      ylt: "",
      web: web[j]
    });
    j++;
  }

  return rows;
}

function abbreviateBook(book) {
  return bookAbbreviations[book] || book.slice(0, 3);
}

function makeReference(verse) {
  const ref = document.createElement("span");
  ref.className = "reference";
  ref.textContent =
    `${abbreviateBook(verse.book)}${verse.chapter}:${verse.verse}`;

  ref.title = `${verse.book} ${verse.chapter}:${verse.verse}`;

  return ref;
}

function makeComparison(yltText, webText) {
  const pair = document.createElement("span");
  pair.className = "comparison";

  if (yltText) {
    const top = document.createElement("span");
    top.className = "version ylt";
    top.textContent = yltText;
    top.title = "Young's Literal Translation";
    pair.appendChild(top);
  }

  if (webText) {
    const bottom = document.createElement("span");
    bottom.className = "version web";
    bottom.textContent = webText;
    bottom.title = "World English Bible";
    pair.appendChild(bottom);
  }

  const connector = document.createElement("span");
  connector.className = "connector";
  connector.setAttribute("aria-hidden", "true");
  pair.appendChild(connector);

  return pair;
}

function renderBible() {
  bible.replaceChildren();

  let lastBook = "";
  let lastChapter = "";

  for (const item of renderedVerses) {
    const bookChanged = item.book !== lastBook;
    const chapterChanged =
      item.book !== lastBook || item.chapter !== lastChapter;

    if (chapterChanged) {
      if (bible.childNodes.length) {
        bible.appendChild(document.createTextNode(" "));
      }

      const heading = document.createElement("span");
      heading.className = "chapter";
      heading.textContent =
        `${item.book} ${item.chapter} `;

      bible.appendChild(heading);

      lastBook = item.book;
      lastChapter = item.chapter;
    }

    bible.appendChild(makeReference(item));

    const rows = alignSentences(item.yltText, item.webText);

    for (const row of rows) {
      if (row.type === "same") {
        bible.appendChild(document.createTextNode(row.text + " "));
      } else {
        bible.appendChild(makeComparison(row.ylt, row.web));
        bible.appendChild(document.createTextNode(" "));
      }
    }
  }
}

function buildVerseList() {
  const keys = new Set([
    ...yltVerses.keys(),
    ...webVerses.keys()
  ]);

  const all = [];

  for (const key of keys) {
    const ylt = yltVerses.get(key);
    const web = webVerses.get(key);
    const source = ylt || web;

    if (!source) continue;

    all.push({
      key,
      book: source.book,
      chapter: source.chapter,
      verse: source.verse,
      yltText: ylt ? ylt.text : "",
      webText: web ? web.text : ""
    });
  }

  all.sort((a, b) => {
    if (a.book !== b.book) {
      return a.key.localeCompare(b.key, undefined, {
        numeric: true
      });
    }

    if (a.chapter !== b.chapter) return a.chapter - b.chapter;
    return a.verse - b.verse;
  });

  return all;
}

function showAll() {
  renderedVerses = buildVerseList();
  renderBible();

  status.textContent =
    `${renderedVerses.length.toLocaleString()} verses loaded`;

  message.textContent = "";
}

function searchVerse() {
  const query = search.value.trim();

  if (!query) {
    showAll();
    return;
  }

  /*
    Accept full references such as Genesis 1:2,
    or compact references such as G1:2.
  */
  const normalizedQuery = query.toLowerCase().replace(/\s+/g, "");

  const found = buildVerseList().filter(item => {
    const full = `${item.book}${item.chapter}:${item.verse}`
      .toLowerCase()
      .replace(/\s+/g, "");

    const compact =
      `${abbreviateBook(item.book)}${item.chapter}:${item.verse}`
        .toLowerCase()
        .replace(/\s+/g, "");

    return full === normalizedQuery || compact === normalizedQuery;
  });

  renderedVerses = found;
  renderBible();

  status.textContent = found.length
    ? `Found ${found.length} verse${found.length === 1 ? "" : "s"}`
    : "No matching verse found";

  message.textContent = found.length
    ? ""
    : "Try a reference such as Genesis 1:2 or G1:2.";
}

function setTheme(theme) {
  document.body.classList.toggle("dark", theme === "dark");
  themeButton.textContent = theme === "dark" ? "Light" : "Dark";
}

themeButton.addEventListener("click", () => {
  setTheme(document.body.classList.contains("dark") ? "light" : "dark");
});

search.addEventListener("keydown", event => {
  if (event.key === "Enter") searchVerse();
});

search.addEventListener("search", () => {
  if (!search.value.trim()) showAll();
});

/* Load the two local text files. */
async function loadBible() {
  setTheme(DEFAULT_THEME);

  try {
    const [yltResponse, webResponse] = await Promise.all([
      fetch("./YLT.txt"),
      fetch("./WEB.txt")
    ]);

    if (!yltResponse.ok) {
      throw new Error(`Could not load YLT.txt (${yltResponse.status})`);
    }

    if (!webResponse.ok) {
      throw new Error(`Could not load WEB.txt (${webResponse.status})`);
    }

    const [yltText, webText] = await Promise.all([
      yltResponse.text(),
      webResponse.text()
    ]);

    yltVerses = parseBible(yltText);
    webVerses = parseBible(webText);

    if (!yltVerses.size && !webVerses.size) {
      throw new Error(
        "No verses were recognized. Check the text-file format."
      );
    }

    showAll();
  } catch (error) {
    status.textContent = "Could not load the Bible files.";
    message.textContent =
      `${error.message} Make sure YLT.txt and WEB.txt are beside index.html, then run Live Server in VS Code.`;
    console.error(error);
  }
}

loadBible();
</script>

</body>
</html>
