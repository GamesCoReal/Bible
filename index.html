
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Family Tree</title>

<style>
:root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --card: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #7ee787;
    --line: #484f58;
}

* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

header {
    flex: 0 0 auto;
    padding: 15px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

header h1 {
    margin: 0;
    color: var(--green);
    font-size: 21px;
}

header p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
}

main {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
}

.tree-section {
    display: flex;
    flex: 0 0 55%;
    flex-direction: column;
    min-height: 0;
    border-bottom: 1px solid var(--border);
}

.toolbar {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.toolbar h2, .details-heading {
    margin: 0;
    font-size: 15px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 6px;
}

button {
    padding: 6px 10px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    border-color: var(--green);
}

button:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
}

#zoomLabel {
    min-width: 42px;
    color: var(--muted);
    text-align: center;
    font-size: 12px;
}

#treeViewport {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    background-image: radial-gradient(#30363d 0.7px, transparent 0.7px);
    background-size: 20px 20px;
}

#treeCanvas {
    position: relative;
    transform-origin: top left;
}

#treeSvg {
    position: absolute;
    inset: 0 auto auto 0;
    overflow: visible;
    pointer-events: none;
}

#treeNodes {
    position: absolute;
    inset: 0;
}

.person-card {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 154px;
    min-height: 62px;
    padding: 8px;
    color: var(--text);
    text-align: center;
    overflow-wrap: anywhere;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
}

.person-card:hover {
    background: #222a32;
    border-color: var(--green);
}

.person-card.selected {
    background: #173321;
    border-color: var(--green);
}

.person-name {
    font-size: 12px;
    font-weight: 650;
    line-height: 1.4;
}

.person-dates {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}

.tree-line {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5;
}

.details {
    flex: 1 1 45%;
    min-height: 0;
    overflow: auto;
    padding: 16px 20px 22px;
}

.details-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}

.badge {
    padding: 4px 8px;
    color: var(--green);
    background: #173321;
    border: 1px solid #285b36;
    border-radius: 20px;
    font-size: 11px;
}

#personName {
    margin: 0 0 8px;
    font-size: 23px;
    overflow-wrap: anywhere;
}

#personSummary {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
}

.info-item {
    min-width: 0;
    padding: 11px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
}

.info-label {
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 11px;
}

.info-value {
    overflow-wrap: anywhere;
    font-size: 13px;
    line-height: 1.5;
}

.details-subheading {
    margin: 17px 0 8px;
    font-size: 14px;
}

#personNotes {
    font-size: 13px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

#status {
    flex: 0 0 auto;
    padding: 8px 14px;
    color: var(--muted);
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11px;
}

#status.error {
    color: #ff7b72;
}

.empty-state {
    max-width: 520px;
    margin: 45px auto;
    padding: 20px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
}

.empty-state strong {
    display: block;
    margin-bottom: 8px;
    color: var(--text);
    font-size: 16px;
}

@media (max-width: 600px) {
    header { padding: 12px 14px; }
    header h1 { font-size: 18px; }
    .toolbar { padding: 8px; }
    .toolbar h2 { font-size: 13px; }
    .controls { gap: 4px; }
    button { padding: 6px 8px; font-size: 11px; }
    .details { padding: 13px; }
}
</style>
</head>

<body>
<header>
    <h1>Bible Family Tree</h1>
    <p>Select a person in the tree to view their information.</p>
</header>

<main>
    <section class="tree-section">
        <div class="toolbar">
            <h2>Family Tree</h2>
            <div class="controls">
                <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
                <span id="zoomLabel">100%</span>
                <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
                <button id="fitButton" type="button">Fit tree</button>
            </div>
        </div>

        <div id="treeViewport">
            <div id="treeCanvas">
                <svg id="treeSvg" aria-hidden="true"></svg>
                <div id="treeNodes"></div>
            </div>
        </div>
    </section>

    <section class="details">
        <div class="details-top">
            <h2 class="details-heading">About</h2>
            <span class="badge">Person details</span>
        </div>

        <div id="detailsContent">
            <h2 id="personName">Select a person</h2>
            <p id="personSummary">Click a person in the family tree to see their information.</p>
            <div class="info-grid" id="personInfo"></div>
            <h3 class="details-subheading" id="notesHeading" hidden>Additional information</h3>
            <div id="personNotes"></div>
        </div>
    </section>
</main>

<div id="status" role="status" aria-live="polite">Loading family tree…</div>

<script>
"use strict";

const $ = selector => document.querySelector(selector);

const CARD_WIDTH = 154;
const CARD_HEIGHT = 62;
const HORIZONTAL_GAP = 34;
const VERTICAL_GAP = 100;
const PADDING = 45;

const PARENT_FIELDS = [
    "father", "mother", "parents", "parent",
    "father name", "mother name"
];

const CHILD_FIELDS = [
    "sons", "daughters", "children", "child"
];

const state = {
    people: [],
    peopleByKey: new Map(),
    selectedKey: null,
    zoom: 1,
    positions: new Map(),
    canvasWidth: 1000,
    canvasHeight: 500
};

function normalizeName(name) {
    return String(name ?? "")
        .normalize("NFKC")
        .trim()
        .replace(/\s+/g, " ")
        .toLocaleLowerCase();
}

function cleanValue(value) {
    return String(value ?? "")
        .replace(/<!--[\s\S]*?-->/g, "")
        .replace(/`([^`]*)`/g, "$1")
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/__(.*?)__/g, "$1")
        .replace(/\*(.*?)\*/g, "$1")
        .replace(/_(.*?)_/g, "$1")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .trim();
}

function setStatus(message, error = false) {
    $("#status").textContent = message;
    $("#status").classList.toggle("error", error);
}

function splitNames(value) {
    if (!value) return [];

    const cleaned = cleanValue(value);

    if (/^(unknown|none|n\/a|na|not known|not applicable|—|-)$/i.test(cleaned)) {
        return [];
    }

    return cleaned
        .split(/\s*(?:,|;|\s+\band\b\s+|\s*&\s*)\s*/i)
        .map(name => name.trim())
        .filter(Boolean);
}

function parseMarkdown(markdown) {
    const lines = markdown.replace(/^\uFEFF/, "").split(/\r?\n/);
    const people = [];
    let current = null;

    for (const originalLine of lines) {
        const line = originalLine.trim();

        // Ignore the main document title.
        if (/^#\s+FAMILY TREE\s*$/i.test(line)) {
            current = null;
            continue;
        }

        // Each single-hash heading represents one person.
        const heading = line.match(/^#\s+(.+?)\s*#*\s*$/);

        if (heading) {
            current = {
                name: heading[1].trim(),
                key: normalizeName(heading[1]),
                fields: {},
                notes: [],
                parents: []
            };

            people.push(current);
            continue;
        }

        if (!current || !line) continue;

        // Read fields such as Parents: Adam, Eve or Summary: ...
        const fieldMatch = line.match(/^([^:]+?)\s*:\s*(.*?)\s*$/);

        if (fieldMatch) {
            const key = fieldMatch[1]
                .trim()
                .toLowerCase()
                .replace(/[_-]+/g, " ");

            const value = fieldMatch[2].trim();

            if (key && value) {
                current.fields[key] = value;
            }
        } else {
            current.notes.push(line);
        }
    }

    // Distinguish people by their full heading, not just a shared first name.
    const uniquePeople = [];
    const peopleByKey = new Map();

    for (const person of people) {
        person.key = normalizeName(person.name);

        if (!peopleByKey.has(person.key)) {
            peopleByKey.set(person.key, person);
            uniquePeople.push(person);
        } else {
            Object.assign(
                peopleByKey.get(person.key).fields,
                person.fields
            );
        }
    }

    // Connect people using their Parents fields.
    for (const person of uniquePeople) {
        const parents = person.fields.parents || person.fields.parent || "";

        for (const parentName of splitNames(parents)) {
            const parentKey = normalizeName(parentName);

            if (
                parentKey !== person.key &&
                peopleByKey.has(parentKey) &&
                !person.parents.includes(parentKey)
            ) {
                person.parents.push(parentKey);
            }
        }
    }

    // Also connect people using Sons, Daughters, and Children fields.
    for (const person of uniquePeople) {
        for (const field of ["sons", "daughters", "children", "child"]) {
            const value = person.fields[field];
            if (!value) continue;

            for (const childName of splitNames(value)) {
                const child = peopleByKey.get(normalizeName(childName));

                if (
                    child &&
                    child.key !== person.key &&
                    !child.parents.includes(person.key)
                ) {
                    child.parents.push(person.key);
                }
            }
        }
    }

    return uniquePeople;
}

function getField(person, names) {
    for (const name of names) {
        if (person.fields[name]) return person.fields[name];
    }
    return "";
}

function getDates(person) {
    const birth = getField(person, ["birth", "born", "birth date"]);
    const death = getField(person, ["death", "died", "death date"]);
    const lifespan = getField(person, ["lifespan", "years"]);

    if (lifespan) return lifespan;
    if (birth && death) return `${birth} – ${death}`;
    if (birth) return `Born ${birth}`;
    if (death) return `Died ${death}`;

    return "";
}

function buildTree() {
    const children = new Map();

    for (const person of state.people) {
        children.set(person.key, []);
    }

    for (const person of state.people) {
        for (const parentKey of person.parents) {
            if (children.has(parentKey)) {
                children.get(parentKey).push(person.key);
            }
        }
    }

    const roots = state.people
        .filter(person =>
            !person.parents.some(key => state.peopleByKey.has(key))
        )
        .map(person => person.key);

    const depth = new Map();
    const visited = new Set();

    function assignDepth(key, level) {
        if (visited.has(key)) return;
        visited.add(key);
        depth.set(key, level);

        for (const childKey of children.get(key) || []) {
            assignDepth(childKey, level + 1);
        }
    }

    for (const root of roots) assignDepth(root, 0);

    // Include disconnected records, avoiding infinite recursion in cycles.
    for (const person of state.people) {
        if (!visited.has(person.key)) assignDepth(person.key, 0);
    }

    const generations = new Map();

    for (const person of state.people) {
        const level = depth.get(person.key) ?? 0;
        if (!generations.has(level)) generations.set(level, []);
        generations.get(level).push(person);
    }

    const levels = [...generations.keys()].sort((a, b) => a - b);

    const widest = Math.max(
        0,
        ...levels.map(level => {
            const count = generations.get(level).length;
            return count * CARD_WIDTH + Math.max(0, count - 1) * HORIZONTAL_GAP;
        })
    );

    state.canvasWidth = Math.max(
        widest + PADDING * 2,
        $("#treeViewport").clientWidth
    );

    const maxLevel = Math.max(0, ...levels);
    state.canvasHeight = Math.max(
        PADDING * 2 + CARD_HEIGHT + maxLevel * VERTICAL_GAP,
        $("#treeViewport").clientHeight
    );

    state.positions.clear();

    for (const level of levels) {
        const row = generations.get(level);
        const rowWidth = row.length * CARD_WIDTH +
            Math.max(0, row.length - 1) * HORIZONTAL_GAP;

        const startX = (state.canvasWidth - rowWidth) / 2;
        const y = PADDING + level * VERTICAL_GAP;

        row.forEach((person, index) => {
            state.positions.set(person.key, {
                x: startX + index * (CARD_WIDTH + HORIZONTAL_GAP),
                y,
                width: CARD_WIDTH,
                height: CARD_HEIGHT
            });
        });
    }

    return children;
}

function renderTree() {
    const canvas = $("#treeCanvas");
    const svg = $("#treeSvg");
    const nodes = $("#treeNodes");

    canvas.style.width = state.canvasWidth + "px";
    canvas.style.height = state.canvasHeight + "px";
    canvas.style.transform = `scale(${state.zoom})`;

    // Reserve the scaled dimensions so scrolling works at every zoom level.
    canvas.style.marginRight = `${state.canvasWidth * (state.zoom - 1)}px`;
    canvas.style.marginBottom = `${state.canvasHeight * (state.zoom - 1)}px`;

    svg.setAttribute("width", state.canvasWidth);
    svg.setAttribute("height", state.canvasHeight);
    svg.setAttribute("viewBox", `0 0 ${state.canvasWidth} ${state.canvasHeight}`);

    svg.replaceChildren();
    nodes.replaceChildren();

    if (!state.people.length) {
        nodes.innerHTML = `
            <div class="empty-state">
                <strong>No people found</strong>
                Check that bible_family_tree.md contains headings such as
                <code># Adam</code>.
            </div>`;
        updateZoomLabel();
        return;
    }

    buildTree();

    // Draw connectors first so they remain behind the cards.
    for (const person of state.people) {
        const childPos = state.positions.get(person.key);
        if (!childPos) continue;

        for (const parentKey of person.parents) {
            const parentPos = state.positions.get(parentKey);
            if (!parentPos) continue;

            const x1 = parentPos.x + parentPos.width / 2;
            const y1 = parentPos.y + parentPos.height;
            const x2 = childPos.x + childPos.width / 2;
            const y2 = childPos.y;
            const middleY = y1 + (y2 - y1) / 2;

            const path = document.createElementNS(
                "http://www.w3.org/2000/svg", "path"
            );

            path.setAttribute("d", `M ${x1} ${y1} V ${middleY} H ${x2} V ${y2}`);
            path.setAttribute("class", "tree-line");
            svg.appendChild(path);
        }
    }

    for (const person of state.people) {
        const pos = state.positions.get(person.key);
        if (!pos) continue;

        const card = document.createElement("button");
        card.type = "button";
        card.className = "person-card";
        card.style.left = pos.x + "px";
        card.style.top = pos.y + "px";
        card.style.width = pos.width + "px";
        card.style.minHeight = pos.height + "px";
        card.setAttribute("aria-label", `View ${person.name}`);

        if (person.key === state.selectedKey) {
            card.classList.add("selected");
        }

        const name = document.createElement("span");
        name.className = "person-name";
        name.textContent = person.name;
        card.appendChild(name);

        const dates = getDates(person);

        if (dates) {
            const date = document.createElement("span");
            date.className = "person-dates";
            date.textContent = dates;
            card.appendChild(date);
        }

        card.addEventListener("click", () => selectPerson(person.key));
        nodes.appendChild(card);
    }

    updateZoomLabel();
}

function selectPerson(key) {
    const person = state.peopleByKey.get(key);
    if (!person) return;

    state.selectedKey = key;
    $("#personName").textContent = person.name;

    $("#personSummary").textContent =
        getField(person, ["summary", "description", "overview"]) ||
        "Information recorded for this person in the family tree.";

    const info = $("#personInfo");
    info.replaceChildren();

    const displayFields = [
        ["Parents", ["parents", "parent", "father", "mother"]],
        ["Spouse", ["spouse", "wife", "husband", "partner"]],
        ["Sons", ["sons"]],
        ["Daughters", ["daughters"]],
        ["Children", ["children", "child"]],
        ["Born", ["birth", "born", "birth date"]],
        ["Died", ["death", "died", "death date"]],
        ["Verses", ["verses", "scripture", "biblical reference", "reference"]],
        ["Tribe", ["tribe"]],
        ["Occupation", ["occupation", "profession"]],
        ["Place", ["place", "location", "birthplace"]]
    ];

    const used = new Set();

    for (const [label, aliases] of displayFields) {
        const value = getField(person, aliases);
        if (!value) continue;

        aliases.forEach(alias => {
            if (person.fields[alias]) used.add(alias);
        });

        const item = document.createElement("div");
        item.className = "info-item";

        const infoLabel = document.createElement("div");
        infoLabel.className = "info-label";
        infoLabel.textContent = label;

        const infoValue = document.createElement("div");
        infoValue.className = "info-value";
        infoValue.textContent = value;

        item.append(infoLabel, infoValue);
        info.appendChild(item);
    }

    // Preserve other fields that are not part of the predefined display list.
    for (const [keyName, value] of Object.entries(person.fields)) {
        if (used.has(keyName) || !value) continue;

        const item = document.createElement("div");
        item.className = "info-item";

        const label = document.createElement("div");
        label.className = "info-label";
        label.textContent = keyName.replace(/\b\w/g, letter => letter.toUpperCase());

        const content = document.createElement("div");
        content.className = "info-value";
        content.textContent = value;

        item.append(label, content);
        info.appendChild(item);
    }

    const notes = person.notes.join("\n\n").trim();
    $("#personNotes").textContent = notes;
    $("#notesHeading").hidden = !notes;

    renderTree();
}

function updateZoomLabel() {
    $("#zoomLabel").textContent = Math.round(state.zoom * 100) + "%";
}

function setZoom(value) {
    state.zoom = Math.max(0.25, Math.min(2, value));
    renderTree();
}

function fitTree() {
    if (!state.people.length) return;

    const viewport = $("#treeViewport");
    const widthScale = viewport.clientWidth / state.canvasWidth;
    const heightScale = viewport.clientHeight / state.canvasHeight;

    state.zoom = Math.max(0.25, Math.min(1, widthScale, heightScale));
    renderTree();

    viewport.scrollTo({ left: 0, top: 0, behavior: "smooth" });
}

// Kept in the code, but there is intentionally no Reset button.
function resetView() {
    state.zoom = 1;
    renderTree();

    $("#treeViewport").scrollTo({
        left: 0,
        top: 0,
        behavior: "smooth"
    });
}

async function startViewer() {
    try {
        setStatus("Loading bible_family_tree.md…");

        const response = await fetch("./bible_family_tree.md", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`Could not load the Markdown file (HTTP ${response.status}).`);
        }

        const markdown = await response.text();

        state.people = parseMarkdown(markdown);
        state.peopleByKey = new Map(
            state.people.map(person => [person.key, person])
        );

        if (!state.people.length) {
            renderTree();
            setStatus("The Markdown file loaded, but no people were found.", true);
            return;
        }

        renderTree();
        selectPerson(state.people[0].key);

        setStatus(`Loaded ${state.people.length} people from bible_family_tree.md.`);

        requestAnimationFrame(fitTree);
    } catch (error) {
        console.error(error);

        $("#treeNodes").innerHTML = `
            <div class="empty-state">
                <strong>Couldn't load the family tree</strong>
                Make sure <code>index.html</code> and
                <code>bible_family_tree.md</code> are in the same folder.
                Open the folder through VS Code Live Server, then refresh.
            </div>`;

        setStatus(error.message || "Could not load the file.", true);
    }
}

$("#zoomIn").addEventListener("click", () => setZoom(state.zoom + 0.1));
$("#zoomOut").addEventListener("click", () => setZoom(state.zoom - 0.1));
$("#fitButton").addEventListener("click", fitTree);

window.addEventListener("resize", () => {
    if (state.people.length) renderTree();
});

startViewer();
</script>
</body>
</html>
