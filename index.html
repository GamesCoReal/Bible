<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Comparison — YLT + WEB</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0b0e12; --panel:#121820; --panel2:#171f29; --text:#e8edf2;
  --muted:#9ba9b7; --border:#2b3642; --accent:#8bd5a8; --ylt:#b8d9ff; --web:#b9efc8;
}
* { box-sizing:border-box; }
html, body {
  width:100%; height:100%; margin:0; padding:0;
  overflow:hidden !important; overscroll-behavior:none; touch-action:pan-y;
}
body {
  height:100dvh; max-height:100dvh; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body.light {
  color-scheme:light;
  --bg:#f2f5f7; --panel:#ffffff; --panel2:#edf1f4; --text:#17212b;
  --muted:#596a78; --border:#d3dce3; --accent:#167a43; --ylt:#164d88; --web:#176b3b;
}
#app {
  width:100%; height:100dvh; max-height:100dvh; min-height:0;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  gap:8px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
           max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  overflow:hidden;
}
header {
  min-height:0; display:grid; gap:7px; padding:9px 11px;
  background:var(--panel); border:1px solid var(--border); border-radius:13px;
  overflow:hidden;
}
.brand-row { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
h1 { margin:0; font-size:clamp(15px,2.4vh,21px); line-height:1.1; font-weight:750; }
.controls { display:flex; gap:6px; align-items:center; min-width:0; }
select, button {
  color:var(--text); background:var(--panel2); border:1px solid var(--border);
  border-radius:9px; min-height:32px; padding:5px 8px; font:inherit; font-size:12px;
}
select { min-width:0; flex:1; }
button { cursor:pointer; white-space:nowrap; }
button:disabled { opacity:.35; cursor:default; }
#selectors { display:grid; grid-template-columns:1.25fr 1fr .8fr; gap:6px; min-width:0; }
#savedLabel { color:var(--muted); font-size:11px; line-height:1.2; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#readerShell {
  min-height:0; height:100%; width:100%; position:relative; overflow:hidden;
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
}
#bookPage {
  position:absolute; inset:0; width:100%; height:100%; min-height:0; min-width:0;
  padding:clamp(10px,2.2vw,22px); overflow:hidden; overflow:clip;
  contain:layout paint size; font-size:15px; line-height:1.48;
}
#pageContent { width:100%; height:100%; overflow:hidden; overflow:clip; }
.chapter-heading {
  margin:0 0 .55em; padding:0 0 .4em; border-bottom:1px solid var(--border);
  font-size:1.15em; line-height:1.2; font-weight:750;
}
.verse-unit { display:block; margin:0 0 .48em; break-inside:avoid; }
.verse-reference { font-size:.78em; font-weight:750; color:var(--muted); margin-right:.38em; white-space:nowrap; }
.sentence { display:inline; }
.comparison { display:block; margin:.15em 0 .22em; }
.ylt, .web { display:block; }
.ylt { color:var(--ylt); }
.web { color:var(--web); }
.translation-label { display:inline-block; font-size:.68em; font-weight:800; letter-spacing:.04em; opacity:.78; margin-right:.3em; }
.identical { display:inline; }
#status {
  position:absolute; inset:auto 8px 8px 8px; pointer-events:none;
  color:var(--muted); font-size:10px; text-align:center; opacity:.75;
}
footer {
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px;
  min-height:0; overflow:hidden;
}
.nav-button { min-width:64px; min-height:36px; font-size:13px; }
#pageInfo { text-align:center; color:var(--muted); font-size:11px; line-height:1.25; min-width:0; overflow:hidden; }
#error { display:none; position:absolute; inset:8px; padding:12px; background:var(--panel); color:#ff8c8c; border:1px solid #a44; border-radius:10px; overflow:hidden; font-size:13px; }
#measureRoot {
  position:fixed; left:-10000px; top:0; visibility:hidden; pointer-events:none;
  width:300px; height:auto; overflow:visible; contain:none;
}
.measure-page { width:100%; height:auto; overflow:visible; font-size:15px; line-height:1.48; }
@media (max-height:560px) {
  #app { gap:5px; padding: max(4px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left)); }
  header { padding:5px 7px; gap:4px; }
  h1 { font-size:14px; }
  select, button { min-height:27px; padding:3px 6px; font-size:11px; }
  #savedLabel { display:none; }
  #bookPage { padding:8px; }
  .verse-unit { margin-bottom:.25em; }
  footer { gap:5px; }
  .nav-button { min-height:29px; min-width:52px; }
}
@media (max-width:370px) {
  #app { gap:5px; padding-left:5px; padding-right:5px; }
  header { padding:7px; }
  .controls { gap:4px; }
  .controls button { padding:4px 5px; }
  #selectors { gap:4px; }
}
@media (prefers-reduced-motion:no-preference) {
  #bookPage.slide-next { animation:slideNext .18s ease-out; }
  #bookPage.slide-prev { animation:slidePrev .18s ease-out; }
  @keyframes slideNext { from { transform:translateX(12px); opacity:.6; } to { transform:translateX(0); opacity:1; } }
  @keyframes slidePrev { from { transform:translateX(-12px); opacity:.6; } to { transform:translateX(0); opacity:1; } }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-row">
      <h1>Bible Comparison</h1>
      <div class="controls">
        <button id="themeBtn" type="button" aria-label="Toggle light and dark theme">☼ Theme</button>
        <button id="sizeBtn" type="button" aria-label="Change text size">A+</button>
        <button id="saveBtn" type="button">Save position</button>
      </div>
    </div>
    <div id="selectors">
      <select id="bookSelect" aria-label="Book" disabled><option>Loading books…</option></select>
      <select id="chapterSelect" aria-label="Chapter" disabled><option>Chapter</option></select>
      <select id="verseSelect" aria-label="Starting verse" disabled><option>Verse</option></select>
    </div>
    <div id="savedLabel">Loading Bible files…</div>
  </header>
  <main id="readerShell" aria-label="Bible reading page">
    <div id="bookPage"><div id="pageContent"></div></div>
    <div id="status"></div>
    <div id="error"></div>
  </main>
  <footer>
    <button id="prevBtn" class="nav-button" type="button">← Previous</button>
    <div id="pageInfo">Loading…</div>
    <button id="nextBtn" class="nav-button" type="button">Next →</button>
  </footer>
</div>
<div id="measureRoot" aria-hidden="true"></div>
<script>
(() => {
  "use strict";
  const BOOKS = [
    "Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth",
    "1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah",
    "Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah",
    "Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum",
    "Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts",
    "Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians",
    "1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews",
    "James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"
  ];
  const $ = id => document.getElementById(id);
  const bookSelect = $("bookSelect"), chapterSelect = $("chapterSelect"), verseSelect = $("verseSelect");
  const pageEl = $("bookPage"), contentEl = $("pageContent"), shell = $("readerShell");
  const measureRoot = $("measureRoot");
  const STORAGE = { position:"bibleComparePositionV3", theme:"bibleCompareThemeV3", size:"bibleCompareSizeV3" };
  let yltMap = new Map(), webMap = new Map(), verses = [], allPages = [];
  let currentPage = 0, fontSize = Number(localStorage.getItem(STORAGE.size)) || 15;
  let touchX = null, touchY = null, resizeTimer = null, rebuilding = false;
  let savedPosition = safeJSON(localStorage.getItem(STORAGE.position), {book:"Genesis",chapter:1,verse:1});
  const abbrev = {
    "Psalms":"Psalm","Song of Solomon":"Song","1 Samuel":"1Sam","2 Samuel":"2Sam",
    "1 Kings":"1Kgs","2 Kings":"2Kgs","1 Chronicles":"1Chr","2 Chronicles":"2Chr",
    "1 Corinthians":"1Cor","2 Corinthians":"2Cor","1 Thessalonians":"1Thess",
    "2 Thessalonians":"2Thess","1 Timothy":"1Tim","2 Timothy":"2Tim",
    "1 Peter":"1Pet","2 Peter":"2Pet","1 John":"1John","2 John":"2John","3 John":"3John"
  };
  function safeJSON(value, fallback) { try { return value ? JSON.parse(value) : fallback; } catch { return fallback; } }
  function normalize(s) { return s.replace(/\uFEFF/g,"").replace(/\s+/g," ").trim(); }
  function key(book, chapter, verse) { return `${book}|${chapter}|${verse}`; }
  function parseBible(text) {
    const map = new Map();
    for (const raw of text.replace(/\r/g,"").split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(/^(.+?)\s+(\d+):(\d+)\s+(.+)$/);
      if (!m) continue;
      let book = normalize(m[1]).replace(/\s+/g," ");
      if (!BOOKS.includes(book)) {
        const lower = book.toLowerCase();
        const match = BOOKS.find(b => b.toLowerCase() === lower);
        if (!match) continue;
        book = match;
      }
      map.set(key(book, Number(m[2]), Number(m[3])), normalize(m[4]));
    }
    return map;
  }
  function splitSentences(text) {
    const clean = normalize(text);
    if (!clean) return [];
    // Keep punctuation with each sentence; avoid splitting common abbreviations.
    const protectedText = clean.replace(/\b(Mr|Mrs|Ms|Dr|St|vs|etc|e\.g|i\.e)\./gi, "$1§");
    const parts = protectedText.match(/[^.!?]+(?:[.!?]+["'”’)\]]*|$)/g) || [protectedText];
    return parts.map(s => s.replace(/§/g,".").trim()).filter(Boolean);
  }
  function buildVerses() {
    const keys = new Set([...yltMap.keys(), ...webMap.keys()]);
    const order = new Map(BOOKS.map((b,i)=>[b,i]));
    const records = [...keys].map(k => {
      const [book, ch, vs] = k.split("|");
      return {book, chapter:Number(ch), verse:Number(vs), key:k, ylt:yltMap.get(k)||"", web:webMap.get(k)||""};
    }).sort((a,b)=>(order.get(a.book)-order.get(b.book)) || a.chapter-b.chapter || a.verse-b.verse);
    verses = records;
    return records;
  }
  function alignSentences(ylt, web) {
    const a = splitSentences(ylt), b = splitSentences(web);
    if (!a.length && !b.length) return [];
    // Ordered alignment: exact matching sentences are shown once; differing sentences are paired.
    const n=a.length, m=b.length;
    if (n*m > 40000) return [{same:false,ylt:ylt,web:web}];
    const dp = Array.from({length:n+1},()=>Array(m+1).fill(0));
    for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
      dp[i][j] = a[i]===b[j] ? 1+dp[i+1][j+1] : Math.max(dp[i+1][j],dp[i][j+1]);
    const out=[]; let i=0,j=0;
    while(i<n || j<m) {
      if(i<n && j<m && a[i]===b[j]) { out.push({same:true,text:a[i]}); i++;j++; }
      else if(i<n && j<m) { out.push({same:false,ylt:a[i],web:b[j]}); i++;j++; }
      else if(i<n) { out.push({same:false,ylt:a[i++],web:""}); }
      else { out.push({same:false,ylt:"",web:b[j++]}); }
    }
    return out;
  }
  function makeVerseUnits() {
    const units=[];
    let lastChapter="";
    for(const v of verses) {
      const chapterKey=`${v.book}|${v.chapter}`;
      const newChapter=chapterKey!==lastChapter;
      lastChapter=chapterKey;
      const aligned=alignSentences(v.ylt,v.web);
      if(!aligned.length) continue;
      aligned.forEach((s,i)=>{
        units.push({book:v.book,chapter:v.chapter,verse:v.verse,key:v.key,chapterKey,newChapter:newChapter&&i===0,
          reference:i===0?`${v.book} ${v.chapter}:${v.verse}`:"", ...s});
      });
    }
    return units;
  }
  function nodeForUnit(unit) {
    const wrap=document.createElement("div");
    wrap.className="verse-unit";
    wrap.dataset.key=unit.key;
    if(unit.reference) {
      const ref=document.createElement("span"); ref.className="verse-reference"; ref.textContent=unit.reference;
      wrap.appendChild(ref);
    }
    if(unit.same) {
      const same=document.createElement("span"); same.className="identical"; same.textContent=unit.text;
      wrap.appendChild(same);
    } else {
      if(unit.ylt) {
        const y=document.createElement("span"); y.className="comparison ylt";
        const label=document.createElement("span"); label.className="translation-label"; label.textContent="YLT";
        y.append(label,document.createTextNode(unit.ylt)); wrap.appendChild(y);
      }
      if(unit.web) {
        const w=document.createElement("span"); w.className="comparison web";
        const label=document.createElement("span"); label.className="translation-label"; label.textContent="WEB";
        w.append(label,document.createTextNode(unit.web)); wrap.appendChild(w);
      }
    }
    return wrap;
  }
  function createHeading(book, chapter) {
    const h=document.createElement("h2"); h.className="chapter-heading";
    h.textContent=`${book} ${chapter}`; return h;
  }
  function targetHeight() { return Math.max(80, pageEl.clientHeight); }
  function measureUnits(units, start, book, chapter, width, height) {
    measureRoot.replaceChildren();
    measureRoot.style.width=`${width}px`;
    const mpage=document.createElement("div"); mpage.className="measure-page";
    mpage.style.width=`${width}px`; mpage.style.fontSize=`${fontSize}px`;
    mpage.style.padding=getComputedStyle(pageEl).padding;
    const inner=document.createElement("div"); inner.style.width="100%";
    inner.appendChild(createHeading(book,chapter));
    mpage.appendChild(inner); measureRoot.appendChild(mpage);
    const pages=[]; let pageUnits=[], currentChapter=`${book}|${chapter}`;
    let usedHeading=true;
    function flush() {
      if(pageUnits.length) pages.push({units:pageUnits,book:pageUnits[0].book,chapter:pageUnits[0].chapter});
      pageUnits=[];
    }
    // Rebuild each page in a measuring container so wrapping and height are based on actual width.
    measureRoot.replaceChildren();
    let probe=document.createElement("div");
    probe.className="measure-page";
    probe.style.width=`${width}px`; probe.style.fontSize=`${fontSize}px`;
    probe.style.padding=getComputedStyle(pageEl).padding;
    let innerProbe=document.createElement("div"); innerProbe.style.width="100%";
    innerProbe.appendChild(createHeading(book,chapter)); probe.appendChild(innerProbe); measureRoot.appendChild(probe);
    const available=height;
    let idx=start;
    while(idx<units.length) {
      const u=units[idx];
      const ck=`${u.book}|${u.chapter}`;
      if(pageUnits.length && ck!==currentChapter) {
        flush(); currentChapter=ck;
        probe.replaceChildren(); innerProbe=document.createElement("div"); innerProbe.style.width="100%";
        innerProbe.appendChild(createHeading(u.book,u.chapter)); probe.appendChild(innerProbe);
      } else if(!pageUnits.length && ck!==currentChapter) {
        currentChapter=ck; probe.replaceChildren(); innerProbe=document.createElement("div"); innerProbe.style.width="100%";
        innerProbe.appendChild(createHeading(u.book,u.chapter)); probe.appendChild(innerProbe);
      }
      const node=nodeForUnit(u);
      innerProbe.appendChild(node);
      if(probe.scrollHeight > available && pageUnits.length>0) {
        innerProbe.removeChild(node);
        flush();
        currentChapter=ck;
        probe.replaceChildren(); innerProbe=document.createElement("div"); innerProbe.style.width="100%";
        innerProbe.appendChild(createHeading(u.book,u.chapter)); probe.appendChild(innerProbe);
        innerProbe.appendChild(nodeForUnit(u));
        // If a single sentence is taller than a page, shrink only enough to keep it on-screen.
        if(probe.scrollHeight > available) {
          const fit=Math.max(8,fontSize*(available-18)/probe.scrollHeight);
          nodeForUnit(u); // keep logic explicit; text size is managed at page-level below
          pages.push({units:[u],book:u.book,chapter:u.chapter,forceSmall:fit});
          idx++; pageUnits=[]; continue;
        }
      }
      pageUnits.push(u); idx++;
    }
    flush();
    return pages;
  }
  function paginate() {
    if(rebuilding || !verses.length) return;
    rebuilding=true;
    const units=makeVerseUnits();
    const width=Math.max(100,pageEl.clientWidth);
    const height=Math.max(100,pageEl.clientHeight);
    // Create pages by adding sentence units to a hidden copy of the exact page content.
    const pages=[]; let pageUnits=[], pageBook="", pageChapter="", probe=document.createElement("div");
    probe.style.cssText=`position:fixed;left:-10000px;top:0;width:${width}px;height:auto;padding:${getComputedStyle(pageEl).padding};font-size:${fontSize}px;line-height:${getComputedStyle(pageEl).lineHeight};overflow:visible;`;
    const inner=document.createElement("div"); inner.style.width="100%"; probe.appendChild(inner); document.body.appendChild(probe);
    function reset(b,c) { inner.replaceChildren(createHeading(b,c)); pageBook=b; pageChapter=c; }
    function flush() {
      if(pageUnits.length) pages.push({units:pageUnits,book:pageUnits[0].book,chapter:pageUnits[0].chapter,
        startVerse:pageUnits[0].verse,endVerse:pageUnits[pageUnits.length-1].verse});
      pageUnits=[];
    }
    if(units.length) reset(units[0].book,units[0].chapter);
    for(const u of units) {
      const ck=`${u.book}|${u.chapter}`;
      if(pageUnits.length && (ck!==`${pageBook}|${pageChapter}` || u.newChapter)) {
        flush(); reset(u.book,u.chapter);
      } else if(!pageUnits.length && (ck!==`${pageBook}|${pageChapter}`)) reset(u.book,u.chapter);
      const n=nodeForUnit(u); inner.appendChild(n);
      if(probe.scrollHeight > height && pageUnits.length>0) {
        inner.removeChild(n); flush(); reset(u.book,u.chapter); inner.appendChild(nodeForUnit(u));
      }
      pageUnits.push(u);
    }
    flush(); probe.remove();
    // Ensure an oversized single sentence is clipped only as a last resort, never scrollable.
    allPages=pages.length?pages:[{units:[],book:"Genesis",chapter:1,startVerse:1,endVerse:1}];
    let target=savedPosition && savedPosition.book ? allPages.findIndex(p =>
      p.book===savedPosition.book && p.chapter===Number(savedPosition.chapter) &&
      Number(savedPosition.verse)>=p.startVerse && Number(savedPosition.verse)<=p.endVerse) : 0;
    if(target<0 && savedPosition) target=allPages.findIndex(p=>p.book===savedPosition.book && p.chapter===Number(savedPosition.chapter));
    if(target<0) target=Math.min(currentPage,allPages.length-1);
    currentPage=Math.max(0,target);
    renderPage(0);
    rebuilding=false;
  }
  function renderPage(direction=0) {
    if(!allPages.length) return;
    const p=allPages[currentPage];
    contentEl.replaceChildren();
    contentEl.appendChild(createHeading(p.book,p.chapter));
    for(const u of p.units) contentEl.appendChild(nodeForUnit(u));
    pageEl.style.fontSize=`${fontSize}px`;
    pageEl.classList.remove("slide-next","slide-prev");
    if(direction) {
      void pageEl.offsetWidth;
      pageEl.classList.add(direction>0?"slide-next":"slide-prev");
    }
    $("pageInfo").textContent=`Page ${currentPage+1} of ${allPages.length} · ${p.book} ${p.chapter}:${p.startVerse}${p.endVerse!==p.startVerse?"–"+p.endVerse:""}`;
    $("prevBtn").disabled=currentPage<=0; $("nextBtn").disabled=currentPage>=allPages.length-1;
    bookSelect.value=p.book; fillChapters(p.book,p.chapter); fillVerses(p.book,p.chapter,p.startVerse);
    $("savedLabel").textContent=`Saved: ${savedPosition.book||"Genesis"} ${savedPosition.chapter||1}:${savedPosition.verse||1}`;
    $("status").textContent="";
  }
  function changePage(next, direction) {
    if(next<0 || next>=allPages.length || next===currentPage) return;
    currentPage=next;
    const p=allPages[currentPage];
    savedPosition={book:p.book,chapter:p.chapter,verse:p.startVerse};
    localStorage.setItem(STORAGE.position,JSON.stringify(savedPosition));
    renderPage(direction);
  }
  function populateBooks() {
    bookSelect.replaceChildren();
    BOOKS.forEach(book=>{const o=document.createElement("option");o.value=book;o.textContent=book;bookSelect.appendChild(o);});
    bookSelect.disabled=false;
  }
  function chaptersFor(book) {
    return [...new Set(verses.filter(v=>v.book===book).map(v=>v.chapter))].sort((a,b)=>a-b);
  }
  function fillChapters(book, selected) {
    chapterSelect.replaceChildren();
    chaptersFor(book).forEach(ch=>{const o=document.createElement("option");o.value=ch;o.textContent=`Chapter ${ch}`;chapterSelect.appendChild(o);});
    chapterSelect.disabled=!chapterSelect.options.length;
    if(selected!=null) chapterSelect.value=String(selected);
  }
  function fillVerses(book, chapter, selected) {
    verseSelect.replaceChildren();
    verses.filter(v=>v.book===book&&v.chapter===Number(chapter)).forEach(v=>{
      const o=document.createElement("option");o.value=v.verse;o.textContent=`Verse ${v.verse}`;verseSelect.appendChild(o);
    });
    verseSelect.disabled=!verseSelect.options.length;
    if(selected!=null) verseSelect.value=String(selected);
  }
  function goToSelection() {
    const book=bookSelect.value, chapter=Number(chapterSelect.value), verse=Number(verseSelect.value);
    if(!book || !chapter || !verse) return;
    savedPosition={book,chapter,verse};
    localStorage.setItem(STORAGE.position,JSON.stringify(savedPosition));
    paginate();
    const idx=allPages.findIndex(p=>p.book===book&&p.chapter===chapter&&verse>=p.startVerse&&verse<=p.endVerse);
    if(idx>=0) { currentPage=idx; renderPage(0); }
  }
  bookSelect.addEventListener("change",()=>{fillChapters(bookSelect.value);fillVerses(bookSelect.value,chapterSelect.value);goToSelection();});
  chapterSelect.addEventListener("change",()=>{fillVerses(bookSelect.value,chapterSelect.value);goToSelection();});
  verseSelect.addEventListener("change",goToSelection);
  $("prevBtn").addEventListener("click",()=>changePage(currentPage-1,-1));
  $("nextBtn").addEventListener("click",()=>changePage(currentPage+1,1));
  $("saveBtn").addEventListener("click",()=>{
    const p=allPages[currentPage]; if(!p) return;
    savedPosition={book:p.book,chapter:p.chapter,verse:p.startVerse};
    localStorage.setItem(STORAGE.position,JSON.stringify(savedPosition));
    $("savedLabel").textContent=`Saved: ${p.book} ${p.chapter}:${p.startVerse}`;
    $("status").textContent="Position saved";
  });
  $("themeBtn").addEventListener("click",()=>{
    document.body.classList.toggle("light");
    localStorage.setItem(STORAGE.theme,document.body.classList.contains("light")?"light":"dark");
    paginate();
  });
  $("sizeBtn").addEventListener("click",()=>{
    fontSize=fontSize>=22?12:fontSize+2;
    localStorage.setItem(STORAGE.size,String(fontSize));
    paginate();
  });
  // Disable browser/page scrolling and overscroll, while still allowing horizontal swipe gestures.
  document.addEventListener("wheel",e=>e.preventDefault(),{passive:false});
  document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
  document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
  shell.addEventListener("touchstart",e=>{if(e.touches.length===1){touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;}},{passive:true});
  shell.addEventListener("touchend",e=>{
    if(touchX===null||touchY===null||!e.changedTouches.length)return;
    const dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.2) changePage(currentPage+(dx<0?1:-1),dx<0?1:-1);
    touchX=touchY=null;
  },{passive:true});
  window.addEventListener("keydown",e=>{
    if(["ArrowLeft","ArrowRight","PageUp","PageDown"].includes(e.key) && !["SELECT","BUTTON"].includes(document.activeElement.tagName)) {
      e.preventDefault();
      if(e.key==="ArrowLeft"||e.key==="PageUp") changePage(currentPage-1,-1);
      else changePage(currentPage+1,1);
    }
  });
  window.addEventListener("resize",()=>{
    clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>paginate(),120);
  });
  if(localStorage.getItem(STORAGE.theme)==="light") document.body.classList.add("light");
  async function start() {
    try {
      $("savedLabel").textContent="Loading YLT.txt and WEB.txt…";
      const [yltText,webText]=await Promise.all([
        fetch("YLT.txt",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Could not load YLT.txt ("+r.status+").");return r.text();}),
        fetch("WEB.txt",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Could not load WEB.txt ("+r.status+").");return r.text();})
      ]);
      yltMap=parseBible(yltText); webMap=parseBible(webText);
      buildVerses();
      if(!verses.length) throw Error("No verses were found. Each line should look like: Genesis 1:1<TAB>Verse text");
      populateBooks();
      let pos=savedPosition||{book:"Genesis",chapter:1,verse:1};
      if(!BOOKS.includes(pos.book)) pos={book:"Genesis",chapter:1,verse:1};
      bookSelect.value=pos.book;
      fillChapters(pos.book,Number(pos.chapter));
      if(!chapterSelect.value) fillChapters(pos.book,1);
      fillVerses(pos.book,chapterSelect.value,Number(pos.verse));
      if(!verseSelect.value && verseSelect.options.length) verseSelect.selectedIndex=0;
      savedPosition={book:bookSelect.value,chapter:Number(chapterSelect.value)||1,verse:Number(verseSelect.value)||1};
      paginate();
      goToSelection();
    } catch(err) {
      $("error").style.display="block";
      $("error").textContent="Unable to load the Bible files.\n\n"+err.message+"\n\nMake sure index.html, YLT.txt, and WEB.txt are in the same folder and open index.html through VS Code Live Server.";
      $("savedLabel").textContent="Bible files could not be loaded.";
      $("pageInfo").textContent="Load error";
    }
  }
  start();
})();
</script>
</body>
</html>
