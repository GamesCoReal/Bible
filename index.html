<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Comparison</title>

<style>
:root {
  --background: #000000;
  --text: #eeeeee;
  --muted: #999999;
  --ylt-color: #eeeeee;
  --web-color: #eeeeee;
  --border: #383838;
  --ylt-underline: #77b5ff;
  --web-underline: #efb36e;
  --connector: #999999;
}

body.light {
  --background: #ffffff;
  --text: #171717;
  --muted: #777777;
  --ylt-color: #202020;
  --web-color: #202020;
  --border: #dddddd;
  --ylt-underline: #4386d6;
  --web-underline: #d08a42;
  --connector: #888888;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--background);
}

body {
  margin: 0;
  padding: 10px;
  background: var(--background);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 9px;
  line-height: 1.4;
  transition: background 0.15s, color 0.15s;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 0;
  margin-bottom: 8px;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  font-family: Arial, sans-serif;
}

.toolbar strong {
  font-size: 12px;
  white-space: nowrap;
}

.toolbar input,
.toolbar button {
  min-width: 0;
  padding: 6px;
  font-size: 11px;
  color: var(--text);
  background: var(--background);
  border: 1px solid var(--border);
  border-radius: 5px;
}

.toolbar input {
  flex: 1;
  width: 100%;
}

#status,
#message {
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--muted);
}

#status {
  margin-bottom: 8px;
}

#message {
  margin-top: 16px;
}

#bible {
  font-size: 9px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  word-break: normal;
}

.chapter {
  display: inline;
  font-size: 10px;
  font-weight: bold;
  line-height: inherit;
  margin-right: 3px;
}

.reference {
  display: inline;
  font-size: 7px;
  line-height: inherit;
  vertical-align: super;
  color: var(--muted);
  white-space: nowrap;
  margin-right: 2px;
}

/* One inline comparison unit, with YLT above WEB. */
.comparison {
  display: inline-grid;
  grid-template-columns: minmax(0, max-content);
  grid-auto-rows: auto;
  vertical-align: baseline;
  max-width: 100%;
  margin: 0 2px;
  line-height: 1.4;
  position: relative;
}

.version {
  display: block;
  min-width: 0;
  max-width: 100%;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 9px;
  font-weight: normal;
  line-height: 1.4;
  overflow-wrap: anywhere;
  word-break: normal;
}

.ylt {
  color: var(--ylt-color);
  text-decoration-line: underline;
  text-decoration-style: dotted;
  text-decoration-color: var(--ylt-underline);
  text-underline-offset: 1px;
  transform: translateX(0.7mm);
}

.web {
  color: var(--web-color);
  text-decoration-line: underline;
  text-decoration-style: dotted;
  text-decoration-color: var(--web-underline);
  text-underline-offset: 1px;
  transform: translateX(-0.7mm);
}

.connector {
  position: absolute;
  left: -3px;
  top: 50%;
  width: 4px;
  height: 4px;
  border-left: 1px solid var(--connector);
  border-bottom: 1px solid var(--connector);
  border-bottom-left-radius: 3px;
  opacity: 0.7;
  pointer-events: none;
}

/* 1.75× text size */
body.text-large #bible {
  font-size: 15.75px;
  line-height: 1.4;
}

body.text-large .version {
  font-size: 15.75px;
  line-height: 1.4;
}

body.text-large .chapter {
  font-size: 17.5px;
}

body.text-large .reference {
  font-size: 12.25px;
}

mark {
  background: #ffe68a;
  color: #111111;
}

@media (max-width: 480px) {
  body {
    padding: 7px;
  }

  .toolbar {
    gap: 4px;
  }

  .toolbar input,
  .toolbar button {
    padding: 5px;
  }
}
</style>
</head>

<body>

<div class="toolbar">
  <strong>Bible</strong>

  <input
    id="search"
    type="search"
    placeholder="Find verse: Genesis 1:2"
    aria-label="Search for a Bible verse"
  >

  <button id="themeButton" type="button">Light</button>
  <button id="sizeButton" type="button">1.75×</button>
</div>

<div id="status">Loading Bible files…</div>
<div id="bible"></div>
<div id="message"></div>

<script>
"use strict";

const DEFAULT_THEME = "dark";

const bibleElement = document.getElementById("bible");
const statusElement = document.getElementById("status");
const messageElement = document.getElementById("message");
const searchInput = document.getElementById("search");
const themeButton = document.getElementById("themeButton");
const sizeButton = document.getElementById("sizeButton");

let yltVerses = new Map();
let webVerses = new Map();
let allVerses = [];
let renderedVerses = [];

/* Canonical Bible book order. */
const bookOrder = [
  "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy",
  "Joshua", "Judges", "Ruth", "1 Samuel", "2 Samuel",
  "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles",
  "Ezra", "Nehemiah", "Esther", "Job", "Psalms", "Psalm",
  "Proverbs", "Ecclesiastes", "Song of Solomon", "Isaiah",
  "Jeremiah", "Lamentations", "Ezekiel", "Daniel", "Hosea",
  "Joel", "Amos", "Obadiah", "Jonah", "Micah", "Nahum",
  "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi",
  "Matthew", "Mark", "Luke", "John", "Acts", "Romans",
  "1 Corinthians", "2 Corinthians", "Galatians", "Ephesians",
  "Philippians", "Colossians", "1 Thessalonians",
  "2 Thessalonians", "1 Timothy", "2 Timothy", "Titus",
  "Philemon", "Hebrews", "James", "1 Peter", "2 Peter",
  "1 John", "2 John", "3 John", "Jude", "Revelation"
];

const bookAbbreviations = {
  "Genesis": "G",
  "Exodus": "Ex",
  "Leviticus": "Le",
  "Numbers": "Nu",
  "Deuteronomy": "De",
  "Joshua": "Jos",
  "Judges": "Jg",
  "Ruth": "Ru",
  "1 Samuel": "1S",
  "2 Samuel": "2S",
  "1 Kings": "1K",
  "2 Kings": "2K",
  "1 Chronicles": "1Ch",
  "2 Chronicles": "2Ch",
  "Ezra": "Ezr",
  "Nehemiah": "Ne",
  "Esther": "Es",
  "Job": "Job",
  "Psalms": "Ps",
  "Psalm": "Ps",
  "Proverbs": "Pr",
  "Ecclesiastes": "Ec",
  "Song of Solomon": "So",
  "Isaiah": "Isa",
  "Jeremiah": "Jer",
  "Lamentations": "La",
  "Ezekiel": "Eze",
  "Daniel": "Da",
  "Hosea": "Ho",
  "Joel": "Joe",
  "Amos": "Am",
  "Obadiah": "Ob",
  "Jonah": "Jon",
  "Micah": "Mic",
  "Nahum": "Na",
  "Habakkuk": "Hab",
  "Zephaniah": "Zep",
  "Haggai": "Hag",
  "Zechariah": "Zec",
  "Malachi": "Mal",
  "Matthew": "Mt",
  "Mark": "Mk",
  "Luke": "Lu",
  "John": "J",
  "Acts": "Ac",
  "Romans": "Ro",
  "1 Corinthians": "1Co",
  "2 Corinthians": "2Co",
  "Galatians": "Ga",
  "Ephesians": "Eph",
  "Philippians": "Php",
  "Colossians": "Col",
  "1 Thessalonians": "1Th",
  "2 Thessalonians": "2Th",
  "1 Timothy": "1Ti",
  "2 Timothy": "2Ti",
  "Titus": "Tit",
  "Philemon": "Phm",
  "Hebrews": "Heb",
  "James": "Jas",
  "1 Peter": "1Pe",
  "2 Peter": "2Pe",
  "1 John": "1J",
  "2 John": "2J",
  "3 John": "3J",
  "Jude": "Jud",
  "Revelation": "Re"
};

function parseBible(text) {
  const verses = new Map();
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;

    const match = line.match(
      /^(.+?)\s+(\d+):(\d+)\s+(.+)$/
    );

    if (!match) continue;

    const book = match[1].trim();
    const chapter = Number(match[2]);
    const verse = Number(match[3]);
    const content = match[4].trim();

    if (!content) continue;

    const key = `${book}|${chapter}|${verse}`;

    verses.set(key, {
      key,
      book,
      chapter,
      verse,
      text: content
    });
  }

  return verses;
}

function normalizeSentence(text) {
  return text
    .normalize("NFC")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

function splitSentences(text) {
  const cleaned = text.replace(/\s+/g, " ").trim();
  if (!cleaned) return [];

  const parts = cleaned.match(
    /[^.!?]+(?:[.!?]+["'”’)\]]*|$)/g
  );

  return (parts || [cleaned])
    .map(part => part.trim())
    .filter(Boolean);
}

function alignSentences(yltText, webText) {
  const ylt = splitSentences(yltText);
  const web = splitSentences(webText);

  const a = ylt.map(normalizeSentence);
  const b = web.map(normalizeSentence);

  const rows = [];
  let i = 0;
  let j = 0;

  while (i < ylt.length && j < web.length) {
    if (a[i] === b[j]) {
      rows.push({ type: "same", text: ylt[i] });
      i++;
      j++;
      continue;
    }

    let match = null;

    for (let di = 0; di <= 5 && i + di < ylt.length; di++) {
      for (let dj = 0; dj <= 5 && j + dj < web.length; dj++) {
        if (a[i + di] === b[j + dj]) {
          const distance = di + dj;

          if (!match || distance < match.distance) {
            match = { di, dj, distance };
          }
        }
      }
    }

    if (!match) {
      rows.push({
        type: "different",
        ylt: ylt.slice(i).join(" "),
        web: web.slice(j).join(" ")
      });

      i = ylt.length;
      j = web.length;
      break;
    }

    const yltOnly = ylt.slice(i, i + match.di);
    const webOnly = web.slice(j, j + match.dj);
    const count = Math.max(yltOnly.length, webOnly.length);

    for (let k = 0; k < count; k++) {
      rows.push({
        type: "different",
        ylt: yltOnly[k] || "",
        web: webOnly[k] || ""
      });
    }

    i += match.di;
    j += match.dj;
  }

  while (i < ylt.length) {
    rows.push({
      type: "different",
      ylt: ylt[i],
      web: ""
    });
    i++;
  }

  while (j < web.length) {
    rows.push({
      type: "different",
      ylt: "",
      web: web[j]
    });
    j++;
  }

  return rows;
}

function abbreviateBook(book) {
  return bookAbbreviations[book] || book.slice(0, 3);
}

function makeReference(item) {
  const reference = document.createElement("span");
  reference.className = "reference";
  reference.textContent =
    `${abbreviateBook(item.book)}${item.chapter}:${item.verse}`;

  reference.title =
    `${item.book} ${item.chapter}:${item.verse}`;

  return reference;
}

function makeComparison(yltText, webText) {
  const comparison = document.createElement("span");
  comparison.className = "comparison";

  if (yltText) {
    const ylt = document.createElement("span");
    ylt.className = "version ylt";
    ylt.textContent = yltText;
    ylt.title = "Young's Literal Translation";
    comparison.appendChild(ylt);
  }

  if (webText) {
    const web = document.createElement("span");
    web.className = "version web";
    web.textContent = webText;
    web.title = "World English Bible";
    comparison.appendChild(web);
  }

  const connector = document.createElement("span");
  connector.className = "connector";
  connector.setAttribute("aria-hidden", "true");
  comparison.appendChild(connector);

  return comparison;
}

function buildVerseList() {
  const keys = new Set([
    ...yltVerses.keys(),
    ...webVerses.keys()
  ]);

  const verses = [];

  for (const key of keys) {
    const ylt = yltVerses.get(key);
    const web = webVerses.get(key);
    const source = ylt || web;

    if (!source) continue;

    verses.push({
      key,
      book: source.book,
      chapter: source.chapter,
      verse: source.verse,
      yltText: ylt ? ylt.text : "",
      webText: web ? web.text : ""
    });
  }

  verses.sort((a, b) => {
    const aBook = bookOrder.indexOf(a.book);
    const bBook = bookOrder.indexOf(b.book);

    const aIndex = aBook === -1 ? 999 : aBook;
    const bIndex = bBook === -1 ? 999 : bBook;

    return (
      aIndex - bIndex ||
      a.chapter - b.chapter ||
      a.verse - b.verse
    );
  });

  return verses;
}

function renderBible() {
  bibleElement.replaceChildren();

  let lastBook = "";
  let lastChapter = "";

  for (const item of renderedVerses) {
    const chapterChanged =
      item.book !== lastBook ||
      item.chapter !== lastChapter;

    if (chapterChanged) {
      if (bibleElement.childNodes.length) {
        bibleElement.appendChild(
          document.createTextNode(" ")
        );
      }

      const heading = document.createElement("span");
      heading.className = "chapter";
      heading.textContent = `${item.book} ${item.chapter}`;

      bibleElement.appendChild(heading);
      bibleElement.appendChild(
        document.createTextNode(" ")
      );

      lastBook = item.book;
      lastChapter = item.chapter;
    }

    bibleElement.appendChild(makeReference(item));
    bibleElement.appendChild(
      document.createTextNode(" ")
    );

    const rows = alignSentences(
      item.yltText,
      item.webText
    );

    for (const row of rows) {
      if (row.type === "same") {
        bibleElement.appendChild(
          document.createTextNode(row.text + " ")
        );
      } else {
        bibleElement.appendChild(
          makeComparison(row.ylt, row.web)
        );

        bibleElement.appendChild(
          document.createTextNode(" ")
        );
      }
    }
  }
}

function showAll() {
  renderedVerses = allVerses;
  renderBible();

  statusElement.textContent =
    `${allVerses.length.toLocaleString()} verses loaded`;

  messageElement.textContent = "";
}

function searchVerse() {
  const query = searchInput.value
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");

  if (!query) {
    showAll();
    return;
  }

  renderedVerses = allVerses.filter(item => {
    const full =
      `${item.book}${item.chapter}:${item.verse}`
        .toLowerCase()
        .replace(/\s+/g, "");

    const compact =
      `${abbreviateBook(item.book)}${item.chapter}:${item.verse}`
        .toLowerCase()
        .replace(/\s+/g, "");

    return full === query || compact === query;
  });

  renderBible();

  statusElement.textContent = renderedVerses.length
    ? `Found ${renderedVerses.length} verse(s)`
    : "No matching verse found";

  messageElement.textContent = renderedVerses.length
    ? ""
    : "Try Genesis 1:2 or G1:2.";
}

function setTheme(theme) {
  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  themeButton.textContent =
    theme === "dark" ? "Light" : "Dark";
}

themeButton.addEventListener("click", () => {
  const currentlyLight =
    document.body.classList.contains("light");

  setTheme(currentlyLight ? "dark" : "light");
});

sizeButton.addEventListener("click", () => {
  const large = document.body.classList.toggle("text-large");
  sizeButton.textContent = large ? "1×" : "1.75×";
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    searchVerse();
  }
});

searchInput.addEventListener("search", () => {
  if (!searchInput.value.trim()) {
    showAll();
  }
});

async function loadBible() {
  setTheme(DEFAULT_THEME);

  try {
    const [yltResponse, webResponse] = await Promise.all([
      fetch("./YLT.txt"),
      fetch("./WEB.txt")
    ]);

    if (!yltResponse.ok) {
      throw new Error(
        `Could not load YLT.txt: ${yltResponse.status}`
      );
    }

    if (!webResponse.ok) {
      throw new Error(
        `Could not load WEB.txt: ${webResponse.status}`
      );
    }

    const [yltText, webText] = await Promise.all([
      yltResponse.text(),
      webResponse.text()
    ]);

    yltVerses = parseBible(yltText);
    webVerses = parseBible(webText);

    if (!yltVerses.size && !webVerses.size) {
      throw new Error(
        "No verses were recognized. Check the text-file format."
      );
    }

    allVerses = buildVerseList();
    showAll();
  } catch (error) {
    statusElement.textContent =
      "Could not load the Bible files.";

    messageElement.textContent =
      `${error.message} Make sure YLT.txt and WEB.txt are beside index.html, then run Live Server.`;

    console.error(error);
  }
}

loadBible();
</script>

</body>
</html>
