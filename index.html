
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Family Tree Viewer</title>

<style>
:root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --card: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #9da7b3;
    --accent: #7ee787;
    --line: #66717e;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

h1 {
    margin: 0;
    font-size: 18px;
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

button, .file-label {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 11px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
}

button:hover, .file-label:hover {
    border-color: var(--accent);
}

button:focus-visible, .file-label:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

input[type="file"] {
    display: none;
}

.workspace {
    display: flex;
    flex: 1;
    min-height: 0;
}

aside {
    width: 240px;
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
}

.side-heading {
    padding: 14px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
}

.search-wrap {
    padding: 0 10px 10px;
}

#search {
    width: 100%;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 13px;
}

#peopleList {
    overflow: auto;
    padding: 0 8px 12px;
}

.person-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin: 2px 0;
    padding: 9px;
    text-align: left;
    border-color: transparent;
    background: transparent;
}

.person-row.selected {
    background: #1c2b21;
    border-color: #315b3b;
}

.avatar {
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--card);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.person-label {
    min-width: 0;
}

.person-name {
    font-size: 13px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.person-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
}

.tree-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
}

.tree-status {
    color: var(--muted);
    font-size: 12px;
}

.tree-actions {
    display: flex;
    gap: 6px;
}

#treeViewport {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    background-image: radial-gradient(#29313a 1px, transparent 1px);
    background-size: 22px 22px;
}

#treeCanvas {
    position: relative;
    width: max-content;
    min-width: 100%;
    min-height: 100%;
    padding: 42px 50px 70px;
    transform-origin: top left;
}

#connectors {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
}

#nodesLayer {
    position: relative;
    z-index: 1;
}

.generation {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 28px;
    width: max-content;
    min-width: 100%;
}

.family-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.person-card {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 164px;
    min-height: 82px;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    text-align: left;
    box-shadow: 0 5px 18px #0003;
}

.person-card:hover {
    border-color: #63816a;
}

.person-card.selected {
    border-color: var(--accent);
    background: #19291e;
}

.card-text {
    min-width: 0;
}

.card-name {
    font-size: 13px;
    line-height: 1.3;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.card-subtitle {
    margin-top: 5px;
    color: var(--muted);
    font-size: 10px;
}

.children-row {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 22px;
    margin-top: 54px;
}

.empty-state {
    max-width: 520px;
    margin: 65px auto;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: var(--panel);
}

.empty-state h2 {
    color: var(--text);
    font-size: 17px;
}

.details {
    width: 300px;
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
}

.details-heading {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
}

.details-heading h2 {
    margin: 0;
    font-size: 15px;
}

.details-content {
    padding: 16px;
    overflow: auto;
}

.detail-avatar {
    width: 64px;
    height: 64px;
    margin-bottom: 12px;
}

.detail-name {
    font-size: 22px;
    font-weight: 750;
    overflow-wrap: anywhere;
}

.detail-type {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.detail-section {
    margin-top: 17px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
}

.detail-section h3 {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
}

.detail-section p,
.detail-section li {
    font-size: 13px;
    line-height: 1.55;
    overflow-wrap: anywhere;
}

.detail-section p {
    margin: 5px 0;
}

.detail-section ul {
    padding-left: 18px;
    margin: 0;
}

.detail-empty {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

.mobile-only {
    display: none;
}

@media (max-width: 1000px) {
    aside {
        width: 205px;
        flex-basis: 205px;
    }

    .details {
        width: 255px;
        flex-basis: 255px;
    }

    .person-card {
        width: 145px;
    }

    .generation {
        gap: 18px;
    }
}

@media (max-width: 720px) {
    header {
        padding: 10px;
        align-items: flex-start;
    }

    h1 {
        font-size: 16px;
    }

    .subtitle {
        max-width: 170px;
        line-height: 1.4;
    }

    .toolbar button,
    .file-label {
        padding: 7px 8px;
        font-size: 12px;
    }

    aside {
        width: 100%;
        flex: 1;
        border-right: 0;
    }

    main,
    .details {
        display: none;
    }

    body.mobile-tree main {
        display: flex;
        position: absolute;
        inset: 0;
        z-index: 3;
        background: var(--bg);
    }

    body.mobile-details .details {
        display: flex;
        position: absolute;
        inset: 0;
        z-index: 4;
        width: 100%;
        border-left: 0;
    }

    body.mobile-tree aside,
    body.mobile-tree .details,
    body.mobile-details aside,
    body.mobile-details main {
        display: none;
    }

    .mobile-only {
        display: inline-block;
    }

    #treeCanvas {
        padding: 30px 24px 60px;
    }

    .generation {
        gap: 18px;
    }

    .children-row {
        gap: 14px;
        margin-top: 42px;
    }

    .person-card {
        width: 145px;
    }

    .tree-toolbar {
        padding: 8px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Bible Family Tree</h1>
        <div class="subtitle">Descendants only · Select a person for details</div>
    </div>

    <div class="toolbar">
        <label class="file-label" for="mdFile">Open .md</label>
        <input id="mdFile" type="file" accept=".md,.markdown,.txt">
        <button id="demoButton">Load demo</button>
        <button id="resetButton">Reset view</button>
    </div>
</header>

<div class="workspace">

    <aside>
        <div class="side-heading">People</div>
        <div class="search-wrap">
            <input id="search" type="search" placeholder="Search people…">
        </div>
        <div id="peopleList"></div>
    </aside>

    <main>
        <div class="tree-toolbar">
            <div id="treeStatus" class="tree-status">No file loaded</div>
            <div class="tree-actions">
                <button id="zoomOut" title="Zoom out">−</button>
                <button id="zoomIn" title="Zoom in">+</button>
                <button id="fitButton">Fit tree</button>
                <button id="showPeople" class="mobile-only">People</button>
            </div>
        </div>

        <div id="treeViewport">
            <div id="treeCanvas">
                <svg id="connectors"></svg>
                <div id="nodesLayer"></div>
            </div>
        </div>
    </main>

    <section class="details">
        <div class="details-heading">
            <h2>Person details</h2>
        </div>

        <div id="detailsContent" class="details-content">
            <div class="detail-empty">
                Open a Markdown file or load the demo, then select a person.
            </div>
        </div>

        <div style="padding: 0 16px 14px">
            <button id="backToTree" class="mobile-only">Back to tree</button>
        </div>
    </section>

</div>

<script>
"use strict";

const $ = selector => document.querySelector(selector);

const DEMO_MARKDOWN = `# FAMILY TREE

## Adam
Sons: Cain, Abel, Seth

## Eve
Sons: Cain, Abel, Seth

## Cain
Parents: Adam, Eve
Sons: Enoch
Summary: Cain was a son of Adam and Eve.
Verses: Genesis 4:1, Genesis 4:17

## Abel
Parents: Adam, Eve
Summary: Abel was a son of Adam and Eve.
Verses: Genesis 4:2

## Seth
Parents: Adam, Eve
Sons: Enosh
Summary: Seth was born after Abel's death.
Verses: Genesis 4:25, Genesis 5:3-6

## Enoch
Parents: Cain
Summary: Enoch was Cain's son.
Verses: Genesis 4:17

## Enosh
Parents: Seth
Summary: Enosh was Seth's son.
Verses: Genesis 4:26, Genesis 5:6-11
`;

const state = {
    people: new Map(),
    selectedId: null,
    zoom: 1
};

function normalizeName(name) {
    return String(name || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLocaleLowerCase();
}

function cleanName(name) {
    return String(name || "").trim().replace(/\s+/g, " ");
}

function getPerson(name) {
    const clean = cleanName(name);

    if (
        !clean ||
        /^(unknown|unnamed|none|n\/a)$/i.test(clean)
    ) {
        return null;
    }

    const id = normalizeName(clean);

    if (!state.people.has(id)) {
        state.people.set(id, {
            id,
            name: clean,
            parents: new Set(),
            sons: new Set(),
            daughters: new Set(),
            summary: [],
            verses: [],
            location: "",
            dates: [],
            image: "",
            notes: []
        });
    }

    return state.people.get(id);
}

function splitNames(value) {
    return value
        .split(/[,;]|\s+and\s+/i)
        .map(value => value.trim())
        .filter(Boolean);
}

function parseMarkdown(markdown) {
    state.people.clear();

    const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
    let current = null;

    for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) continue;

        const heading = line.match(/^#{1,6}\s+(.+?)\s*#*$/);

        if (heading) {
            const name = heading[1].trim();

            if (/^(family tree|people|records|index)$/i.test(name)) {
                current = null;
            } else {
                current = getPerson(name);
            }

            continue;
        }

        if (!current) continue;

        const match = line.match(
            /^(?:[-*]\s*)?(Parents?|Father|Mother|Sons?|Daughters?|Children|Summary|Description|Biography|Verses?|References?|Location|Place|Dates?|Born|Died|Image|Photo|Portrait)\s*:\s*(.*)$/i
        );

        if (!match) {
            current.notes.push(line.replace(/^[-*]\s*/, ""));
            continue;
        }

        const key = match[1].toLowerCase();
        const value = match[2].trim();

        if (/^parents?$/.test(key)) {
            for (const name of splitNames(value)) {
                const parent = getPerson(name);

                if (parent && parent.id !== current.id) {
                    current.parents.add(parent.id);
                }
            }
        } else if (/^(father|mother)$/.test(key)) {
            const parent = getPerson(value);

            if (parent && parent.id !== current.id) {
                current.parents.add(parent.id);
            }
        } else if (/^sons?$/.test(key)) {
            for (const name of splitNames(value)) {
                const child = getPerson(name);

                if (child && child.id !== current.id) {
                    current.sons.add(child.id);
                    child.parents.add(current.id);
                }
            }
        } else if (/^daughters?$/.test(key)) {
            for (const name of splitNames(value)) {
                const child = getPerson(name);

                if (child && child.id !== current.id) {
                    current.daughters.add(child.id);
                    child.parents.add(current.id);
                }
            }
        } else if (/^children$/.test(key)) {
            for (const name of splitNames(value)) {
                const child = getPerson(name);

                if (child && child.id !== current.id) {
                    child.parents.add(current.id);
                    current.sons.add(child.id);
                }
            }
        } else if (/^(summary|description|biography)$/.test(key)) {
            current.summary.push(value);
        } else if (/^(verses?|references?)$/.test(key)) {
            current.verses.push(...splitNames(value));
        } else if (/^(location|place)$/.test(key)) {
            current.location = value;
        } else if (/^(dates?|born|died)$/.test(key)) {
            current.dates.push(`${match[1]}: ${value}`);
        } else if (/^(image|photo|portrait)$/.test(key)) {
            current.image = value;
        }
    }

    /*
      A Parents: entry creates a parent-child link even if that
      parent didn't list the child in their Sons:/Daughters: field.
      If the child's sex isn't known, it is placed in a generic
      descendants branch instead of being invented as a son/daughter.
    */
    for (const person of state.people.values()) {
        for (const parentId of person.parents) {
            const parent = state.people.get(parentId);

            if (
                parent &&
                !parent.sons.has(person.id) &&
                !parent.daughters.has(person.id)
            ) {
                parent.sons.add(person.id);
            }
        }
    }
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function initials(name) {
    return name
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part[0] || "")
        .join("")
        .toUpperCase();
}

function imageSource(value) {
    const source = String(value || "").trim();

    if (/^(https?:\/\/|data:image\/|blob:)/i.test(source)) {
        return source;
    }

    return "";
}

function avatarMarkup(person, extraClass = "") {
    const source = imageSource(person.image);

    if (source) {
        return `
            <div class="avatar ${extraClass}">
                <img src="${escapeHtml(source)}" alt="">
            </div>
        `;
    }

    return `
        <div class="avatar ${extraClass}">
            ${escapeHtml(initials(person.name))}
        </div>
    `;
}

function getRoots() {
    const roots = [...state.people.values()].filter(person =>
        ![...person.parents].some(id => state.people.has(id))
    );

    const priority = person => {
        if (person.name.toLowerCase() === "adam") return 0;
        if (person.name.toLowerCase() === "eve") return 1;
        return 2;
    };

    return roots.sort((a, b) =>
        priority(a) - priority(b) ||
        a.name.localeCompare(b.name)
    );
}

function buildForest() {
    const visited = new Set();
    const forest = [];

    function buildNode(person, depth = 0) {
        if (!person || depth > 100 || visited.has(person.id)) {
            return null;
        }

        visited.add(person.id);

        const childIds = [
            ...new Set([...person.sons, ...person.daughters])
        ]
            .filter(id => state.people.has(id))
            .sort((a, b) =>
                state.people.get(a).name.localeCompare(
                    state.people.get(b).name
                )
            );

        const children = [];

        for (const childId of childIds) {
            const childNode = buildNode(
                state.people.get(childId),
                depth + 1
            );

            if (childNode) children.push(childNode);
        }

        return {
            id: person.id,
            children
        };
    }

    for (const root of getRoots()) {
        const node = buildNode(root);
        if (node) forest.push(node);
    }

    /*
      Disconnected records are still displayed. This is useful when
      the Markdown file has not yet documented someone's ancestors.
    */
    for (const person of [...state.people.values()].sort((a, b) =>
        a.name.localeCompare(b.name)
    )) {
        if (!visited.has(person.id)) {
            const node = buildNode(person);
            if (node) forest.push(node);
        }
    }

    return forest;
}

function createPersonCard(person, childCount) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "person-card";
    button.dataset.personId = person.id;

    button.innerHTML = `
        ${avatarMarkup(person)}
        <div class="card-text">
            <div class="card-name">${escapeHtml(person.name)}</div>
            <div class="card-subtitle">
                ${childCount
                    ? `${childCount} descendant${childCount === 1 ? "" : "s"} below`
                    : "Person record"}
            </div>
        </div>
    `;

    button.addEventListener("click", () => {
        selectPerson(person.id);

        if (window.matchMedia("(max-width: 720px)").matches) {
            document.body.classList.add("mobile-details");
        }
    });

    return button;
}

function renderTree() {
    const layer = $("#nodesLayer");
    const svg = $("#connectors");

    layer.innerHTML = "";
    svg.innerHTML = "";

    if (!state.people.size) {
        layer.innerHTML = `
            <div class="empty-state">
                <h2>Your family tree will appear here</h2>
                <p>Open a Markdown file or load the demo.</p>
                <p>Person headings and fields like
                <b>Sons:</b>, <b>Daughters:</b>, <b>Parents:</b>,
                <b>Summary:</b> and <b>Verses:</b> are supported.</p>
                <p>People are deduplicated by name. Connections represent
                parent-to-child relationships only.</p>
            </div>
        `;

        $("#treeStatus").textContent = "No people loaded";
        renderPeopleList();
        return;
    }

    const forest = buildForest();
    const topRow = document.createElement("div");

    topRow.className = "generation";

    function layoutNode(node) {
        const person = state.people.get(node.id);
        const unit = document.createElement("div");

        unit.className = "family-unit";
        unit.dataset.personId = node.id;

        unit.appendChild(createPersonCard(person, node.children.length));

        if (node.children.length) {
            const childRow = document.createElement("div");

            childRow.className = "children-row";
            childRow.dataset.parentId = node.id;

            for (const child of node.children) {
                childRow.appendChild(layoutNode(child));
            }

            unit.appendChild(childRow);
        }

        return unit;
    }

    for (const root of forest) {
        topRow.appendChild(layoutNode(root));
    }

    layer.appendChild(topRow);

    $("#treeCanvas").style.zoom = String(state.zoom);

    requestAnimationFrame(drawConnectors);
    renderPeopleList();

    $("#treeStatus").textContent =
        `${state.people.size} people · descendants only`;
}

function drawConnectors() {
    const canvas = $("#treeCanvas");
    const svg = $("#connectors");

    if (!canvas || !svg) return;

    const canvasRect = canvas.getBoundingClientRect();
    const width = Math.max(canvas.scrollWidth, canvasRect.width);
    const height = Math.max(canvas.scrollHeight, canvasRect.height);

    svg.setAttribute("width", width);
    svg.setAttribute("height", height);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.style.width = `${width}px`;
    svg.style.height = `${height}px`;
    svg.innerHTML = "";

    const ns = "http://www.w3.org/2000/svg";

    document.querySelectorAll(".family-unit").forEach(unit => {
        const parentCard = unit.querySelector(":scope > .person-card");
        const childRow = unit.querySelector(":scope > .children-row");

        if (!parentCard || !childRow) return;

        const parentRect = parentCard.getBoundingClientRect();
        const children = [
            ...childRow.querySelectorAll(
                ":scope > .family-unit > .person-card"
            )
        ];

        if (!children.length) return;

        const parentX =
            (parentRect.left + parentRect.width / 2 - canvasRect.left) /
            state.zoom;

        const parentY =
            (parentRect.bottom - canvasRect.top) / state.zoom;

        const childRects = children.map(child =>
            child.getBoundingClientRect()
        );

        const childXs = childRects.map(rect =>
            (rect.left + rect.width / 2 - canvasRect.left) / state.zoom
        );

        const childTop = Math.min(...childRects.map(rect =>
            (rect.top - canvasRect.top) / state.zoom
        ));

        const middleY = parentY + (childTop - parentY) / 2;

        let pathData;

        if (childXs.length === 1) {
            pathData = `M ${parentX} ${parentY} V ${childTop}`;
        } else {
            pathData =
                `M ${parentX} ${parentY} V ${middleY} ` +
                `M ${Math.min(...childXs)} ${middleY} ` +
                `H ${Math.max(...childXs)} ` +
                childXs.map(x =>
                    `M ${x} ${middleY} V ${childTop}`
                ).join(" ");
        }

        const path = document.createElementNS(ns, "path");

        path.setAttribute("d", pathData);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "var(--line)");
        path.setAttribute("stroke-width", "1.5");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");

        svg.appendChild(path);
    });
}

function renderPeopleList(filter = $("#search").value || "") {
    const list = $("#peopleList");
    const query = normalizeName(filter);

    list.innerHTML = "";

    const people = [...state.people.values()]
        .filter(person => person.name.toLowerCase().includes(query))
        .sort((a, b) => a.name.localeCompare(b.name));

    for (const person of people) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "person-row";
        button.dataset.personId = person.id;

        const parentNames = [...person.parents]
            .map(id => state.people.get(id)?.name)
            .filter(Boolean);

        button.innerHTML = `
            ${avatarMarkup(person)}
            <div class="person-label">
                <div class="person-name">${escapeHtml(person.name)}</div>
                <div class="person-meta">
                    ${escapeHtml(parentNames.join(", ") || "Parent not recorded")}
                </div>
            </div>
        `;

        button.addEventListener("click", () => {
            selectPerson(person.id);

            if (window.matchMedia("(max-width: 720px)").matches) {
                document.body.classList.add("mobile-details");
            }
        });

        list.appendChild(button);
    }

    if (!people.length) {
        list.innerHTML = `
            <div class="detail-empty" style="padding:12px">
                No matching people.
            </div>
        `;
    }
}

function addDetailSection(container, title, html) {
    const section = document.createElement("section");

    section.className = "detail-section";
    section.innerHTML = `
        <h3>${escapeHtml(title)}</h3>
        ${html}
    `;

    container.appendChild(section);
}

function makeList(items) {
    if (!items.length) return "<p>Not recorded</p>";

    return `<ul>${items.map(item =>
        `<li>${escapeHtml(item)}</li>`
    ).join("")}</ul>`;
}

function selectPerson(id) {
    const person = state.people.get(id);

    if (!person) return;

    state.selectedId = id;

    document.querySelectorAll(".person-card").forEach(card => {
        card.classList.toggle("selected", card.dataset.personId === id);
    });

    document.querySelectorAll(".person-row").forEach(row => {
        row.classList.toggle("selected", row.dataset.personId === id);
    });

    renderDetails(person);
    renderPeopleList();
}

function renderDetails(person) {
    const container = $("#detailsContent");

    container.innerHTML = `
        ${avatarMarkup(person, "detail-avatar")}
        <div class="detail-name">${escapeHtml(person.name)}</div>
        <div class="detail-type">Biblical person · family tree record</div>
    `;

    const parents = [...person.parents]
        .map(id => state.people.get(id)?.name)
        .filter(Boolean);

    const sons = [...person.sons]
        .map(id => state.people.get(id)?.name)
        .filter(Boolean);

    const daughters = [...person.daughters]
        .map(id => state.people.get(id)?.name)
        .filter(Boolean);

    addDetailSection(container, "Parents", makeList(parents));
    addDetailSection(container, "Sons", makeList(sons));
    addDetailSection(container, "Daughters", makeList(daughters));

    if (person.summary.length) {
        addDetailSection(
            container,
            "Summary",
            `<p>${person.summary.map(escapeHtml).join("<br>")}</p>`
        );
    }

    if (person.verses.length) {
        addDetailSection(
            container,
            "Bible references",
            makeList(person.verses)
        );
    }

    if (person.location) {
        addDetailSection(
            container,
            "Location",
            `<p>${escapeHtml(person.location)}</p>`
        );
    }

    if (person.dates.length) {
        addDetailSection(
            container,
            "Dates / timeline",
            makeList(person.dates)
        );
    }

    if (person.notes.length) {
        addDetailSection(
            container,
            "Notes",
            makeList(person.notes)
        );
    }

    if (person.image && !imageSource(person.image)) {
        addDetailSection(
            container,
            "Portrait",
            `<p>${escapeHtml(person.image)}</p>
             <p>Use an https:// image URL to display a portrait.</p>`
        );
    }
}

function loadMarkdown(markdown, filename = "Markdown file") {
    parseMarkdown(markdown);

    state.selectedId = null;

    renderTree();

    $("#detailsContent").innerHTML = `
        <div class="detail-empty">
            Loaded <b>${escapeHtml(filename)}</b>.<br>
            Select a person in the tree or list to see their details.
        </div>
    `;
}

$("#mdFile").addEventListener("change", async event => {
    const file = event.target.files?.[0];

    if (!file) return;

    try {
        const markdown = await file.text();
        loadMarkdown(markdown, file.name);
    } catch (error) {
        alert("Could not read the file: " + error.message);
    }
});

$("#demoButton").addEventListener("click", () => {
    loadMarkdown(DEMO_MARKDOWN, "Built-in demo");
});

$("#resetButton").addEventListener("click", () => {
    state.zoom = 1;
    renderTree();

    $("#treeViewport").scrollTo({
        left: 0,
        top: 0,
        behavior: "smooth"
    });
});

$("#zoomIn").addEventListener("click", () => {
    state.zoom = Math.min(1.7, state.zoom + 0.1);
    renderTree();
});

$("#zoomOut").addEventListener("click", () => {
    state.zoom = Math.max(0.5, state.zoom - 0.1);
    renderTree();
});

$("#fitButton").addEventListener("click", () => {
    const viewport = $("#treeViewport");
    const canvas = $("#treeCanvas");

    const available = (viewport.clientWidth - 60) /
        Math.max(1, canvas.scrollWidth / state.zoom);

    state.zoom = Math.max(0.5, Math.min(1, available));

    renderTree();

    viewport.scrollTo({
        left: 0,
        top: 0,
        behavior: "smooth"
    });
});

$("#search").addEventListener("input", event => {
    renderPeopleList(event.target.value);
});

$("#showPeople").addEventListener("click", () => {
    document.body.classList.remove("mobile-tree", "mobile-details");
});

$("#backToTree").addEventListener("click", () => {
    document.body.classList.remove("mobile-details");
    document.body.classList.add("mobile-tree");
});

$("#treeViewport").addEventListener("scroll", () => {
    requestAnimationFrame(drawConnectors);
});

window.addEventListener("resize", () => {
    requestAnimationFrame(drawConnectors);
});

/* Start with an empty viewer. */
loadMarkdown("", "No file loaded");
</script>

</body>
</html>
