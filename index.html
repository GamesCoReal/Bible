<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Bible — YLT & WEB</title>

  <style>
    :root {
      --background: #ffffff;
      --text: #151515;
      --muted: #777777;
      --line: #999999;
    }

    body.dark {
      --background: #000000;
      --text: #f5f5f5;
      --muted: #999999;
      --line: #666666;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.2;
      transition: background 0.15s, color 0.15s;
    }

    #reader {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px;
    }

    .verse {
      margin: 0 0 5mm;
    }

    .reference {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 12px;
      margin-bottom: 2mm;
    }

    .sentence {
      margin: 0;
      padding: 0;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    /* Matching sentences appear only once. */
    .same {
      margin: 0 0 2mm;
    }

    /*
      Different sentences share a central reference line.
      YLT is above the line and shifted +2mm on X.
      WEB is below the line and shifted -2mm on X.
    */
    .comparison {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      row-gap: 2mm;
      margin: 0 0 2mm;
      padding: 0;
    }

    .ylt {
      grid-row: 1;
      transform: translateX(2mm);
      width: calc(100% - 2mm);
      justify-self: start;
    }

    .web {
      grid-row: 2;
      transform: translateX(-2mm);
      width: calc(100% - 2mm);
      justify-self: end;
    }

    /*
      Center reference connector:
      top path goes right, up, then right;
      bottom path mirrors it downward.
      It is decorative and does not block text.
    */
    .connector {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 0;
    }

    .connector path {
      fill: none;
      stroke: var(--line);
      stroke-width: 0.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ylt,
    .web {
      position: relative;
      z-index: 1;
    }

    .error {
      font-family: Arial, sans-serif;
      color: #d33;
      white-space: pre-wrap;
    }

    @media (max-width: 500px) {
      #reader {
        padding: 12px;
      }

      body {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main id="reader">Loading Bible...</main>

  <script>
    "use strict";

    const reader = document.getElementById("reader");

    // Set this to "dark" for a black background on startup.
    const DEFAULT_THEME = "light";

    if (DEFAULT_THEME === "dark") {
      document.body.classList.add("dark");
    }

    // Read the tab-separated Bible files.
    async function loadBibleFile(filename) {
      const response = await fetch(filename);

      if (!response.ok) {
        throw new Error(
          `Could not load ${filename}. Make sure it is beside index.html.`
        );
      }

      const contents = await response.text();
      const verses = new Map();

      for (const line of contents.split(/\r?\n/)) {
        const match = line.match(/^(.+?)\s+(\d+:\d+)\t(.*)$/);

        if (!match) continue;

        const [, book, chapterVerse, text] = match;
        const reference = `${book} ${chapterVerse}`;

        verses.set(reference, text.trim());
      }

      return verses;
    }

    // Normalize punctuation so punctuation differences alone
    // do not make otherwise identical sentences count as different.
    function normalize(text) {
      return text
        .normalize("NFC")
        .replace(/[‘’]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[—–]/g, "-")
        .replace(/[.,;:!?'"()[\]{}\-]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    /*
      Split at sentence-ending punctuation.
      Commas and semicolons do not split a sentence.
    */
    function splitSentences(text) {
      const matches = text.match(
        /[^.!?]+(?:[.!?]+["'’”)]*)*|[.!?]+/g
      );

      return (matches || [])
        .map(sentence => sentence.trim())
        .filter(Boolean);
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    /*
      Find shared sentences in both translations, preserving order.
      Matching sentences appear once. Unmatched runs are paired.
    */
    function alignSentences(yltText, webText) {
      const ylt = splitSentences(yltText);
      const web = splitSentences(webText);

      const a = ylt.map(normalize);
      const b = web.map(normalize);

      const dp = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
      );

      // Longest common subsequence table.
      for (let i = a.length - 1; i >= 0; i--) {
        for (let j = b.length - 1; j >= 0; j--) {
          if (a[i] === b[j]) {
            dp[i][j] = 1 + dp[i + 1][j + 1];
          } else {
            dp[i][j] = Math.max(
              dp[i + 1][j],
              dp[i][j + 1]
            );
          }
        }
      }

      const result = [];
      let i = 0;
      let j = 0;

      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) {
          result.push({
            type: "same",
            text: ylt[i]
          });

          i++;
          j++;
          continue;
        }

        const startI = i;
        const startJ = j;

        // Collect unmatched sentences until a shared sentence is found.
        while (
          i < a.length &&
          j < b.length &&
          a[i] !== b[j]
        ) {
          if (dp[i + 1][j] >= dp[i][j + 1]) {
            i++;
          } else {
            j++;
          }
        }

        const yltPart = ylt.slice(startI, i);
        const webPart = web.slice(startJ, j);

        if (yltPart.length || webPart.length) {
          result.push({
            type: "different",
            ylt: yltPart.join(" "),
            web: webPart.join(" ")
          });
        }
      }

      // Include remaining sentences if one translation has extra text.
      if (i < a.length || j < b.length) {
        result.push({
          type: "different",
          ylt: ylt.slice(i).join(" "),
          web: web.slice(j).join(" ")
        });
      }

      return result;
    }

    // Draw the mirrored right-angle connector.
    function makeConnector() {
      const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );

      svg.setAttribute("class", "connector");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      const upper = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      // Right → up → right.
      upper.setAttribute("d", "M0 35 H5 V20 H10");

      const lower = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      // Mirrored: right → down → right.
      lower.setAttribute("d", "M0 65 H5 V80 H10");

      svg.append(upper, lower);

      return svg;
    }

    function renderVerse(reference, yltText, webText) {
      const verse = makeElement("section", "verse");

      verse.appendChild(
        makeElement("div", "reference", reference)
      );

      // If a reference is present in only one file, show what exists.
      if (yltText === undefined || webText === undefined) {
        const availableText = yltText ?? webText ?? "";

        verse.appendChild(
          makeElement("p", "sentence same", availableText)
        );

        return verse;
      }

      const aligned = alignSentences(yltText, webText);

      for (const item of aligned) {
        if (item.type === "same") {
          verse.appendChild(
            makeElement("p", "sentence same", item.text)
          );

          continue;
        }

        const comparison = makeElement("div", "comparison");
        comparison.appendChild(makeConnector());

        if (item.ylt) {
          comparison.appendChild(
            makeElement("p", "sentence ylt", item.ylt)
          );
        }

        if (item.web) {
          comparison.appendChild(
            makeElement("p", "sentence web", item.web)
          );
        }

        verse.appendChild(comparison);
      }

      return verse;
    }

    async function startReader() {
      try {
        const [ylt, web] = await Promise.all([
          loadBibleFile("./YLT.txt"),
          loadBibleFile("./WEB.txt")
        ]);

        // Keep the original order from YLT, then add WEB-only references.
        const references = [
          ...new Set([...ylt.keys(), ...web.keys()])
        ];

        const fragment = document.createDocumentFragment();

        for (const reference of references) {
          fragment.appendChild(
            renderVerse(
              reference,
              ylt.get(reference),
              web.get(reference)
            )
          );
        }

        reader.replaceChildren(fragment);
      } catch (error) {
        reader.replaceChildren(
          makeElement("p", "error", error.message)
        );
      }
    }

    startReader();
  </script>
</body>
</html>
