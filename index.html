
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Comparison</title>

<style>
:root {
  color-scheme: dark;
  --background: #101010;
  --paper: #191919;
  --text: #eeeeee;
  --muted: #999999;
  --border: #393939;
  --ylt-underline: #77b5ff;
  --web-underline: #efb36e;
}

body.light {
  color-scheme: light;
  --background: #f3eee4;
  --paper: #fffdf7;
  --text: #25221d;
  --muted: #77716a;
  --border: #d8d0c3;
  --ylt-underline: #4386d6;
  --web-underline: #d08a42;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 16px;
}

button, select, input {
  font: inherit;
}

button, select {
  color: var(--text);
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}

button {
  cursor: pointer;
}

button:focus-visible, select:focus-visible {
  outline: 2px solid #77b5ff;
  outline-offset: 2px;
}

.hidden { display: none !important; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-family: Arial, sans-serif;
}

.brand {
  font-weight: bold;
  font-size: 17px;
}

.header-actions {
  display: flex;
  gap: 6px;
}

.header-actions button {
  padding: 7px 10px;
  font-size: 13px;
}

main {
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 20px 14px 30px;
}

h1 {
  font-size: 25px;
  margin: 0 0 8px;
}

.subtitle {
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 22px;
}

.field {
  display: grid;
  gap: 7px;
  margin-bottom: 17px;
  font-family: Arial, sans-serif;
}

.field label {
  font-size: 13px;
  color: var(--muted);
}

.field select {
  width: 100%;
}

.selector-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
}

.saved-point {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 16px;
  font-family: Arial, sans-serif;
}

.primary {
  width: 100%;
  background: #397653;
  color: white;
  border: none;
  padding: 13px;
  font-weight: bold;
}

#status, #notice {
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  margin: 12px 0;
}

#reader { min-width: 0; }

.reader-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  font-family: Arial, sans-serif;
}

.reader-location {
  font-size: 13px;
  color: var(--muted);
  min-width: 0;
}

.page-count {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.book-frame {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 8px 28px #00000012;
}

.book-page {
  padding: 26px 23px;
  min-height: 400px;
  font-size: 15px;
  line-height: 1.65;
  overflow-wrap: anywhere;
  word-break: normal;
}

.page-heading {
  font-size: 17px;
  font-weight: bold;
  margin: 0 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.page-content {
  font-size: inherit;
  line-height: inherit;
}

.verse-ref {
  color: var(--muted);
  font-size: 0.7em;
  vertical-align: super;
  white-space: nowrap;
  margin-right: 3px;
}

.same {
  display: inline;
}

.comparison {
  display: inline-flex;
  flex-direction: column;
  vertical-align: baseline;
  max-width: 100%;
  margin: 0 2px;
  line-height: inherit;
}

.version {
  display: block;
  max-width: 100%;
  overflow-wrap: anywhere;
  font-size: inherit;
  line-height: inherit;
}

.ylt {
  text-decoration: underline dotted var(--ylt-underline);
  text-underline-offset: 2px;
  transform: translateX(1px);
}

.web {
  text-decoration: underline dotted var(--web-underline);
  text-underline-offset: 2px;
  transform: translateX(-1px);
}

.page-navigation {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 13px;
}

.page-navigation button {
  flex: 1;
}

.page-navigation button:disabled {
  opacity: .35;
  cursor: default;
}

#readerSettings {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

#readerSettings button {
  font-size: 13px;
}

.error {
  color: #e58a8a;
  white-space: pre-wrap;
}

@media (max-width: 420px) {
  header { padding: 10px; }
  main { padding: 15px 9px 24px; }
  .selector-card { padding: 15px; }
  .book-page { padding: 20px 15px; }
  h1 { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<header>
  <div class="brand">Bible Comparison</div>
  <div class="header-actions">
    <button id="themeButton" type="button">Light</button>
    <button id="sizeButton" type="button">A+</button>
  </div>
</header>

<main>
  <section id="selector">
    <h1>Where would you like to read?</h1>
    <p class="subtitle">
      Choose a book, chapter, and starting verse.
      Your last saved starting point will be highlighted.
    </p>

    <div class="selector-card">
      <p id="savedPoint" class="saved-point">
        Loading your reading position…
      </p>

      <div class="field">
        <label for="bookSelect">Book</label>
        <select id="bookSelect"></select>
      </div>

      <div class="field">
        <label for="chapterSelect">Chapter</label>
        <select id="chapterSelect"></select>
      </div>

      <div class="field">
        <label for="verseSelect">Starting verse</label>
        <select id="verseSelect"></select>
      </div>

      <button id="startButton" class="primary" type="button">
        Start reading
      </button>
    </div>
  </section>

  <section id="reader" class="hidden">
    <div class="reader-toolbar">
      <button id="chooseButton" type="button">Books</button>
      <div id="readerLocation" class="reader-location"></div>
      <div id="pageCount" class="page-count"></div>
    </div>

    <div id="bookFrame" class="book-frame">
      <article id="bookPage" class="book-page">
        <div id="pageHeading" class="page-heading"></div>
        <div id="pageContent" class="page-content"></div>
      </article>
    </div>

    <div class="page-navigation">
      <button id="previousButton" type="button">← Previous</button>
      <button id="nextButton" type="button">Next →</button>
    </div>

    <div id="readerSettings">
      <button id="smallerButton" type="button">A− Smaller</button>
      <button id="largerButton" type="button">A+ Larger</button>
    </div>

    <p id="notice" aria-live="polite">
      Swipe horizontally to turn pages.
    </p>
  </section>

  <div id="status" aria-live="polite">Loading Bible files…</div>
</main>

<script>
"use strict";

const BOOK_ORDER = [
  "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy",
  "Joshua", "Judges", "Ruth", "1 Samuel", "2 Samuel",
  "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles",
  "Ezra", "Nehemiah", "Esther", "Job", "Psalms", "Proverbs",
  "Ecclesiastes", "Song of Solomon", "Isaiah", "Jeremiah",
  "Lamentations", "Ezekiel", "Daniel", "Hosea", "Joel", "Amos",
  "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk",
  "Zephaniah", "Haggai", "Zechariah", "Malachi", "Matthew",
  "Mark", "Luke", "John", "Acts", "Romans", "1 Corinthians",
  "2 Corinthians", "Galatians", "Ephesians", "Philippians",
  "Colossians", "1 Thessalonians", "2 Thessalonians",
  "1 Timothy", "2 Timothy", "Titus", "Philemon", "Hebrews",
  "James", "1 Peter", "2 Peter", "1 John", "2 John", "3 John",
  "Jude", "Revelation"
];

const ABBR = {
  "Genesis":"G", "Exodus":"Ex", "Leviticus":"Le", "Numbers":"Nu",
  "Deuteronomy":"De", "Joshua":"Jos", "Judges":"Jg", "Ruth":"Ru",
  "1 Samuel":"1S", "2 Samuel":"2S", "1 Kings":"1K", "2 Kings":"2K",
  "1 Chronicles":"1Ch", "2 Chronicles":"2Ch", "Ezra":"Ezr",
  "Nehemiah":"Ne", "Esther":"Es", "Job":"Job", "Psalms":"Ps",
  "Proverbs":"Pr", "Ecclesiastes":"Ec", "Song of Solomon":"So",
  "Isaiah":"Isa", "Jeremiah":"Jer", "Lamentations":"La",
  "Ezekiel":"Eze", "Daniel":"Da", "Hosea":"Ho", "Joel":"Joe",
  "Amos":"Am", "Obadiah":"Ob", "Jonah":"Jon", "Micah":"Mic",
  "Nahum":"Na", "Habakkuk":"Hab", "Zephaniah":"Zep",
  "Haggai":"Hag", "Zechariah":"Zec", "Malachi":"Mal",
  "Matthew":"Mt", "Mark":"Mk", "Luke":"Lu", "John":"J",
  "Acts":"Ac", "Romans":"Ro", "1 Corinthians":"1Co",
  "2 Corinthians":"2Co", "Galatians":"Ga", "Ephesians":"Eph",
  "Philippians":"Php", "Colossians":"Col", "1 Thessalonians":"1Th",
  "2 Thessalonians":"2Th", "1 Timothy":"1Ti", "2 Timothy":"2Ti",
  "Titus":"Tit", "Philemon":"Phm", "Hebrews":"Heb", "James":"Jas",
  "1 Peter":"1Pe", "2 Peter":"2Pe", "1 John":"1J", "2 John":"2J",
  "3 John":"3J", "Jude":"Jud", "Revelation":"Re"
};

const STORAGE_KEY = "bibleComparison.reader.v1";
const THEME_KEY = "bibleComparison.theme";
const SIZE_KEY = "bibleComparison.fontSize";

const $ = id => document.getElementById(id);

const selector = $("selector");
const reader = $("reader");
const bookSelect = $("bookSelect");
const chapterSelect = $("chapterSelect");
const verseSelect = $("verseSelect");
const savedPoint = $("savedPoint");
const status = $("status");
const pageHeading = $("pageHeading");
const pageContent = $("pageContent");
const bookPage = $("bookPage");
const bookFrame = $("bookFrame");

let yltMap = new Map();
let webMap = new Map();
let verses = [];
let pages = [];
let pageIndex = 0;
let fontSize = Number(localStorage.getItem(SIZE_KEY)) || 15;
let savedPosition = readSavedPosition();
let resizeFrame = 0;
let touchStartX = null;
let touchStartY = null;
let animationBusy = false;

function readSavedPosition() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
  } catch {
    return null;
  }
}

function savePosition() {
  const page = pages[pageIndex];
  if (!page) return;

  savedPosition = {
    book: page.book,
    chapter: page.chapter,
    verse: page.startVerse,
    currentVerse: page.currentVerse
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedPosition));
  } catch {
    // Reading still works when local storage is unavailable.
  }

  updateSavedPoint();
}

function updateSavedPoint() {
  if (savedPosition?.book) {
    savedPoint.textContent =
      `Last saved starting point: ${savedPosition.book} ` +
      `${savedPosition.chapter}:${savedPosition.verse}`;
  } else {
    savedPoint.textContent = "No saved reading position yet.";
  }
}

function parseBible(text) {
  const result = new Map();

  for (const raw of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
    const line = raw.trim();
    const match = line.match(/^(.+?)\s+(\d+):(\d+)\s+(.+)$/);
    if (!match) continue;

    const book = match[1].trim();
    const chapter = Number(match[2]);
    const verse = Number(match[3]);
    const content = match[4].trim();

    if (!content) continue;

    const key = `${book}|${chapter}|${verse}`;
    result.set(key, { key, book, chapter, verse, text: content });
  }

  return result;
}

function normalize(text) {
  return text.normalize("NFC")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

function splitSentences(text) {
  const cleaned = text.replace(/\s+/g, " ").trim();
  if (!cleaned) return [];

  return (cleaned.match(/[^.!?]+(?:[.!?]+["'”’)\]]*|$)/g) || [cleaned])
    .map(s => s.trim())
    .filter(Boolean);
}

function alignSentences(yltText, webText) {
  const a = splitSentences(yltText);
  const b = splitSentences(webText);
  const na = a.map(normalize);
  const nb = b.map(normalize);
  const rows = [];
  let i = 0, j = 0;

  while (i < a.length && j < b.length) {
    if (na[i] === nb[j]) {
      rows.push({ type: "same", text: a[i] });
      i++; j++;
      continue;
    }

    let match = null;

    for (let di = 0; di <= 5 && i + di < a.length; di++) {
      for (let dj = 0; dj <= 5 && j + dj < b.length; dj++) {
        if (na[i + di] === nb[j + dj]) {
          const distance = di + dj;
          if (!match || distance < match.distance) {
            match = { di, dj, distance };
          }
        }
      }
    }

    if (!match) {
      rows.push({
        type: "different",
        ylt: a.slice(i).join(" "),
        web: b.slice(j).join(" ")
      });
      i = a.length;
      j = b.length;
      break;
    }

    const onlyA = a.slice(i, i + match.di);
    const onlyB = b.slice(j, j + match.dj);
    const count = Math.max(onlyA.length, onlyB.length);

    for (let k = 0; k < count; k++) {
      rows.push({
        type: "different",
        ylt: onlyA[k] || "",
        web: onlyB[k] || ""
      });
    }

    i += match.di;
    j += match.dj;
  }

  while (i < a.length) {
    rows.push({ type: "different", ylt: a[i++], web: "" });
  }
  while (j < b.length) {
    rows.push({ type: "different", ylt: "", web: b[j++] });
  }

  return rows;
}

function buildVerses() {
  const keys = new Set([...yltMap.keys(), ...webMap.keys()]);
  const list = [];

  for (const key of keys) {
    const ylt = yltMap.get(key);
    const web = webMap.get(key);
    const source = ylt || web;
    if (!source) continue;

    list.push({
      key,
      book: source.book,
      chapter: source.chapter,
      verse: source.verse,
      yltText: ylt?.text || "",
      webText: web?.text || ""
    });
  }

  list.sort((a, b) => {
    const ai = BOOK_ORDER.indexOf(a.book);
    const bi = BOOK_ORDER.indexOf(b.book);
    return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi)
      || a.chapter - b.chapter
      || a.verse - b.verse;
  });

  return list;
}

function chapterVerses(book, chapter) {
  return verses.filter(v => v.book === book && v.chapter === chapter);
}

function populateBooks() {
  bookSelect.replaceChildren();

  const available = [...new Set(verses.map(v => v.book))];
  available.sort((a, b) => {
    const ai = BOOK_ORDER.indexOf(a);
    const bi = BOOK_ORDER.indexOf(b);
    return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi);
  });

  for (const book of available) {
    bookSelect.add(new Option(book, book));
  }

  if (savedPosition?.book && available.includes(savedPosition.book)) {
    bookSelect.value = savedPosition.book;
  }

  populateChapters();
}

function populateChapters() {
  chapterSelect.replaceChildren();

  const chapters = [...new Set(
    verses.filter(v => v.book === bookSelect.value).map(v => v.chapter)
  )].sort((a, b) => a - b);

  for (const chapter of chapters) {
    chapterSelect.add(new Option(String(chapter), String(chapter)));
  }

  if (savedPosition?.book === bookSelect.value &&
      chapters.includes(Number(savedPosition.chapter))) {
    chapterSelect.value = String(savedPosition.chapter);
  }

  populateStartingVerses();
}

function populateStartingVerses() {
  verseSelect.replaceChildren();

  const list = chapterVerses(bookSelect.value, Number(chapterSelect.value));
  for (const item of list) {
    verseSelect.add(new Option(String(item.verse), String(item.verse)));
  }

  if (savedPosition?.book === bookSelect.value &&
      Number(savedPosition.chapter) === Number(chapterSelect.value) &&
      list.some(v => v.verse === Number(savedPosition.verse))) {
    verseSelect.value = String(savedPosition.verse);
  }
}

function setTheme(light) {
  document.body.classList.toggle("light", light);
  $("themeButton").textContent = light ? "Dark" : "Light";
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch {}
}

function setFontSize(size) {
  fontSize = Math.max(11, Math.min(28, size));
  bookPage.style.fontSize = `${fontSize}px`;
  $("sizeButton").textContent = `${Math.round(fontSize / 15 * 100)}%`;
  try { localStorage.setItem(SIZE_KEY, String(fontSize)); } catch {}

  if (!reader.classList.contains("hidden")) {
    repaginateKeepingPosition();
  }
}

function makeVerseReference(item) {
  const ref = document.createElement("span");
  ref.className = "verse-ref";
  ref.textContent = `${ABBR[item.book] || item.book.slice(0, 3)}${item.chapter}:${item.verse}`;
  ref.title = `${item.book} ${item.chapter}:${item.verse}`;
  return ref;
}

function makeSentenceNode(row) {
  if (row.type === "same") {
    const span = document.createElement("span");
    span.className = "same";
    span.textContent = row.text + " ";
    return span;
  }

  const comparison = document.createElement("span");
  comparison.className = "comparison";

  if (row.ylt) {
    const ylt = document.createElement("span");
    ylt.className = "version ylt";
    ylt.textContent = row.ylt;
    ylt.title = "Young's Literal Translation";
    comparison.appendChild(ylt);
  }

  if (row.web) {
    const web = document.createElement("span");
    web.className = "version web";
    web.textContent = row.web;
    web.title = "World English Bible";
    comparison.appendChild(web);
  }

  return comparison;
}

function makeUnits(startAt) {
  const units = [];
  let previousChapter = "";

  for (const item of verses) {
    const chapterKey = `${item.book}|${item.chapter}`;
    const newChapter = chapterKey !== previousChapter;
    previousChapter = chapterKey;

    const rows = alignSentences(item.yltText, item.webText);
    let first = true;

    for (const row of rows) {
      const node = document.createElement("span");
      node.className = "sentence-unit";

      if (first) {
        node.appendChild(makeVerseReference(item));
        first = false;
      }

      node.appendChild(makeSentenceNode(row));

      units.push({
        node,
        book: item.book,
        chapter: item.chapter,
        verse: item.verse,
        key: item.key,
        newChapter: newChapter && units.length === 0,
        chapterKey
      });
    }

    // Keep verses that have no split sentence rows visible.
    if (rows.length === 0) {
      const node = document.createElement("span");
      node.appendChild(makeVerseReference(item));
      units.push({
        node,
        book: item.book,
        chapter: item.chapter,
        verse: item.verse,
        key: item.key,
        newChapter,
        chapterKey
      });
    }
  }

  return units;
}

/*
  Paginate by measuring rendered sentence units.
  Each new chapter begins on a new page.
  If a single unit is taller than an empty page, it is allowed to overflow;
  this avoids silently dropping its text.
*/
function paginate(startVerseKey = null) {
  const units = makeUnits();
  const pagesOut = [];
  let current = null;

  const availableHeight = () => {
    const style = getComputedStyle(bookPage);
    return bookPage.clientHeight
      - parseFloat(style.paddingTop)
      - parseFloat(style.paddingBottom);
  };

  function newPage(unit) {
    current = {
      book: unit.book,
      chapter: unit.chapter,
      startVerse: unit.verse,
      currentVerse: unit.verse,
      units: []
    };
    pagesOut.push(current);
    pageContent.replaceChildren();
  }

  const measure = document.createElement("div");
  measure.className = "page-content";
  measure.style.position = "absolute";
  measure.style.visibility = "hidden";
  measure.style.left = "-100000px";
  measure.style.top = "0";
  measure.style.width = `${pageContent.clientWidth}px`;
  measure.style.fontSize = `${fontSize}px`;
  measure.style.lineHeight = getComputedStyle(pageContent).lineHeight;
  document.body.appendChild(measure);

  const headingHeight = 40;
  let lastChapterKey = "";

  for (const unit of units) {
    const chapterKey = unit.chapterKey;
    const chapterChanged = chapterKey !== lastChapterKey;
    lastChapterKey = chapterKey;

    if (!current || chapterChanged) {
      newPage(unit);
    }

    measure.appendChild(unit.node.cloneNode(true));
    const contentHeight = measure.scrollHeight;

    if (current.units.length > 0 &&
        headingHeight + contentHeight > availableHeight()) {
      measure.replaceChildren();
      newPage(unit);
      measure.appendChild(unit.node.cloneNode(true));
    }

    current.units.push(unit);
    current.currentVerse = unit.verse;
  }

  measure.remove();

  // Render each page's heading and units in a hidden measuring container.
  // Then refine pagination against the actual page content area.
  return pagesOut;
}

function paginateAccurately() {
  const units = makeUnits();
  const result = [];
  const frameWidth = bookPage.clientWidth || bookFrame.clientWidth;
  const style = getComputedStyle(bookPage);
  const verticalPadding =
    parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

  const measurer = document.createElement("div");
  measurer.style.cssText = `
    position:fixed; left:-100000px; top:0;
    visibility:hidden; width:${frameWidth}px;
    padding:${style.paddingTop} ${style.paddingRight} ${style.paddingBottom} ${style.paddingLeft};
    box-sizing:border-box; font-family:${style.fontFamily};
    font-size:${fontSize}px; line-height:${style.lineHeight};
    overflow-wrap:anywhere;
  `;
  document.body.appendChild(measurer);

  const content = document.createElement("div");
  content.style.lineHeight = style.lineHeight;
  measurer.appendChild(content);

  const heading = document.createElement("div");
  heading.className = "page-heading";
  heading.style.fontSize = "17px";
  heading.textContent = "Genesis 1";
  content.appendChild(heading);

  const usableHeight = Math.max(100, bookPage.clientHeight - verticalPadding);
  let current = null;
  let currentChapter = "";
  let usedNodes = [];

  function startPage(unit) {
    current = {
      book: unit.book,
      chapter: unit.chapter,
      startVerse: unit.verse,
      currentVerse: unit.verse,
      units: []
    };
    result.push(current);
    usedNodes = [];
    content.replaceChildren();

    const h = document.createElement("div");
    h.className = "page-heading";
    h.style.fontSize = "17px";
    h.textContent = `${unit.book} ${unit.chapter}`;
    content.appendChild(h);
  }

  function addUnit(unit) {
    const clone = unit.node.cloneNode(true);
    content.appendChild(clone);
    current.units.push(unit);
    current.currentVerse = unit.verse;
    usedNodes.push(clone);
  }

  for (const unit of units) {
    const chapterKey = `${unit.book}|${unit.chapter}`;
    const chapterChanged = chapterKey !== currentChapter;

    if (!current || chapterChanged) {
      startPage(unit);
      currentChapter = chapterKey;
    }

    const before = content.scrollHeight;
    const clone = unit.node.cloneNode(true);
    content.appendChild(clone);
    const after = content.scrollHeight;

    if (current.units.length > 0 && after > usableHeight) {
      content.removeChild(clone);
      startPage(unit);
      addUnit(unit);
    } else {
      current.units.push(unit);
      current.currentVerse = unit.verse;
      usedNodes.push(clone);
    }

    // Avoid an infinite loop for a sentence taller than the whole page.
    if (content.scrollHeight > usableHeight && current.units.length === 1) {
      current.overflow = true;
    }
  }

  measurer.remove();
  return result;
}

function findPageForPosition(position) {
  if (!position) return 0;

  let found = pages.findIndex(page =>
    page.book === position.book &&
    page.chapter === Number(position.chapter) &&
    page.startVerse === Number(position.verse)
  );

  if (found >= 0) return found;

  found = pages.findIndex(page =>
    page.book === position.book &&
    page.chapter === Number(position.chapter) &&
    page.startVerse <= Number(position.verse) &&
    page.currentVerse >= Number(position.verse)
  );

  if (found >= 0) return found;

  return pages.findIndex(page =>
    page.book === position.book &&
    page.chapter === Number(position.chapter)
  ) >= 0
    ? pages.findIndex(page =>
        page.book === position.book &&
        page.chapter === Number(position.chapter))
    : 0;
}

function renderCurrentPage() {
  const page = pages[pageIndex];
  if (!page) return;

  pageHeading.textContent = `${page.book} ${page.chapter}`;
  pageContent.replaceChildren();

  for (const unit of page.units) {
    pageContent.appendChild(unit.node.cloneNode(true));
    pageContent.appendChild(document.createTextNode(" "));
  }

  $("readerLocation").textContent =
    `${page.book} ${page.chapter}:${page.startVerse}`;

  $("pageCount").textContent =
    `${pageIndex + 1} / ${pages.length}`;

  $("previousButton").disabled = pageIndex === 0;
  $("nextButton").disabled = pageIndex >= pages.length - 1;

  savePosition();
}

function showReader() {
  selector.classList.add("hidden");
  reader.classList.remove("hidden");
  status.textContent = `${verses.length.toLocaleString()} verses loaded`;

  requestAnimationFrame(() => {
    pages = paginateAccurately();

    if (!pages.length) {
      status.textContent = "No pages could be created.";
      return;
    }

    pageIndex = findPageForPosition(savedPosition);
    renderCurrentPage();
  });
}

function chooseStart() {
  const book = bookSelect.value;
  const chapter = Number(chapterSelect.value);
  const verse = Number(verseSelect.value);

  savedPosition = {
    book, chapter, verse,
    currentVerse: verse
  };

  showReader();
}

function returnToSelector() {
  reader.classList.add("hidden");
  selector.classList.remove("hidden");
  populateBooks();
  updateSavedPoint();
}

function changePage(delta) {
  if (animationBusy) return;

  const next = pageIndex + delta;
  if (next < 0 || next >= pages.length) return;

  animationBusy = true;
  const direction = delta > 0 ? 1 : -1;

  bookPage.style.transition = "transform 140ms ease, opacity 140ms ease";
  bookPage.style.transform = `translateX(${direction * -22}px)`;
  bookPage.style.opacity = "0.4";

  setTimeout(() => {
    pageIndex = next;
    renderCurrentPage();

    bookPage.style.transform = `translateX(${direction * 22}px)`;

    requestAnimationFrame(() => {
      bookPage.style.transform = "translateX(0)";
      bookPage.style.opacity = "1";

      setTimeout(() => {
        bookPage.style.transition = "";
        animationBusy = false;
      }, 150);
    });
  }, 120);
}

function repaginateKeepingPosition() {
  const page = pages[pageIndex];
  const target = page ? {
    book: page.book,
    chapter: page.chapter,
    verse: page.startVerse,
    currentVerse: page.currentVerse
  } : savedPosition;

  requestAnimationFrame(() => {
    pages = paginateAccurately();
    pageIndex = findPageForPosition(target);
    renderCurrentPage();
  });
}

bookSelect.addEventListener("change", () => {
  savedPosition = null;
  populateChapters();
});

chapterSelect.addEventListener("change", () => {
  savedPosition = null;
  populateStartingVerses();
});

verseSelect.addEventListener("change", () => {
  savedPosition = null;
});

$("startButton").addEventListener("click", chooseStart);
$("chooseButton").addEventListener("click", returnToSelector);
$("previousButton").addEventListener("click", () => changePage(-1));
$("nextButton").addEventListener("click", () => changePage(1));

$("themeButton").addEventListener("click", () => {
  setTheme(!document.body.classList.contains("light"));
  if (!reader.classList.contains("hidden")) {
    repaginateKeepingPosition();
  }
});

$("sizeButton").addEventListener("click", () => {
  setFontSize(fontSize >= 25 ? 15 : fontSize + 2);
});

$("smallerButton").addEventListener("click", () => setFontSize(fontSize - 1));
$("largerButton").addEventListener("click", () => setFontSize(fontSize + 1));

bookFrame.addEventListener("touchstart", event => {
  const touch = event.changedTouches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}, { passive: true });

bookFrame.addEventListener("touchend", event => {
  if (touchStartX === null || touchStartY === null) return;

  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  touchStartX = null;
  touchStartY = null;

  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.25) {
    changePage(dx < 0 ? 1 : -1);
  }
}, { passive: true });

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!reader.classList.contains("hidden")) {
      repaginateKeepingPosition();
    }
  }, 180);
});

async function loadBible() {
  try {
    const theme = localStorage.getItem(THEME_KEY);
    setTheme(theme === "light");

    const [yltResponse, webResponse] = await Promise.all([
      fetch("./YLT.txt"),
      fetch("./WEB.txt")
    ]);

    if (!yltResponse.ok) {
      throw new Error(`YLT.txt returned HTTP ${yltResponse.status}`);
    }
    if (!webResponse.ok) {
      throw new Error(`WEB.txt returned HTTP ${webResponse.status}`);
    }

    const [yltText, webText] = await Promise.all([
      yltResponse.text(),
      webResponse.text()
    ]);

    yltMap = parseBible(yltText);
    webMap = parseBible(webText);
    verses = buildVerses();

    if (!verses.length) {
      throw new Error(
        "No verses were recognized. Expected lines such as Genesis 1:1 followed by verse text."
      );
    }

    populateBooks();
    updateSavedPoint();
    status.textContent = `${verses.length.toLocaleString()} verses loaded`;
  } catch (error) {
    status.textContent = "Could not load the Bible files.";
    status.classList.add("error");
    status.textContent += "\n" + error.message +
      "\n\nCheck that YLT.txt and WEB.txt are beside index.html, and open the site using VS Code Live Server.";
    console.error(error);
  }
}

loadBible();
</script>
