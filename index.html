
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bible — YLT &amp; WEB</title>

  <style>
    :root {
      --background: #ffffff;
      --text: #151515;
      --muted: #777777;
      --line: #888888;
    }

    body.dark {
      --background: #000000;
      --text: #f5f5f5;
      --muted: #999999;
      --line: #777777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      line-height: 1.15;
    }

    #reader {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 6px;
    }

    .verse {
      margin: 0 0 2mm;
    }

    .reference {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 8px;
      line-height: 1.1;
      margin: 0 0 0.5mm;
    }

    .sentence {
      margin: 0;
      padding: 0;
      font-size: 11px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    /* Identical sentences are shown once. */
    .same {
      margin: 0 0 0.5mm;
    }

    /*
      Differing translations are kept close together.
      YLT: above, shifted right by 2 mm.
      WEB: below, shifted left by 2 mm.
    */
    .comparison {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0 0 0.5mm;
      padding: 0;
    }

    .ylt,
    .web {
      position: relative;
      width: calc(100% - 2mm);
      margin: 0;
      padding: 0;
    }

    .ylt {
      align-self: flex-start;
      transform: translateX(2mm);
    }

    .web {
      align-self: flex-end;
      transform: translateX(-2mm);
    }

    /*
      Rounded curved arrow connecting the translations.
      It is decorative, not interactive.
    */
    .connector {
      position: absolute;
      left: 0;
      top: 50%;
      width: 30px;
      height: 40px;
      transform: translateY(-50%);
      overflow: visible;
      pointer-events: none;
      z-index: 2;
    }

    .connector path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .error {
      color: #d33;
      font-family: Arial, sans-serif;
      font-size: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 500px) {
      #reader {
        padding: 5px;
      }

      body,
      .sentence {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main id="reader">Loading Bible...</main>

  <script>
    "use strict";

    const reader = document.getElementById("reader");

    // Change to "dark" for a black background by default.
    const DEFAULT_THEME = "light";

    if (DEFAULT_THEME === "dark") {
      document.body.classList.add("dark");
    }

    // Parse lines formatted as:
    // Genesis 1:1<TAB>Bible verse text
    async function loadBibleFile(filename) {
      const response = await fetch(filename);

      if (!response.ok) {
        throw new Error(
          `Could not load ${filename}. Make sure it is beside index.html.`
        );
      }

      const contents = await response.text();
      const verses = new Map();

      for (const line of contents.split(/\r?\n/)) {
        const match = line.match(/^(.+?)\s+(\d+:\d+)\t(.*)$/);

        if (!match) continue;

        const [, book, chapterVerse, text] = match;
        verses.set(`${book} ${chapterVerse}`, text.trim());
      }

      return verses;
    }

    // Ignore punctuation and capitalization when comparing sentences.
    function normalize(text) {
      return text
        .normalize("NFC")
        .replace(/[‘’]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[—–]/g, "-")
        .replace(/[.,;:!?'"()[\]{}\-]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    // Split at sentence-ending punctuation, not commas or semicolons.
    function splitSentences(text) {
      const matches = text.match(
        /[^.!?]+(?:[.!?]+["'’”)]*)*|[.!?]+/g
      );

      return (matches || [])
        .map(sentence => sentence.trim())
        .filter(Boolean);
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    // Create a smooth, rounded arrow.
    function makeConnector() {
      const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );

      svg.setAttribute("class", "connector");
      svg.setAttribute("viewBox", "0 0 30 40");
      svg.setAttribute("aria-hidden", "true");

      // The connector travels right, curves upward, then turns right.
      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      path.setAttribute(
        "d",
        "M2 30 H8 Q13 30 13 25 V15 Q13 10 18 10 H25"
      );

      // Arrowhead.
      const arrowhead = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      arrowhead.setAttribute("d", "M21 6 L26 10 L21 14");

      svg.append(path, arrowhead);

      return svg;
    }

    /*
      Align sentences in order using the longest common subsequence.
      Matching sentences are displayed once.
      Unmatched sentences are displayed as a YLT/WEB pair.
    */
    function alignSentences(yltText, webText) {
      const ylt = splitSentences(yltText);
      const web = splitSentences(webText);

      const a = ylt.map(normalize);
      const b = web.map(normalize);

      const dp = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
      );

      for (let i = a.length - 1; i >= 0; i--) {
        for (let j = b.length - 1; j >= 0; j--) {
          if (a[i] === b[j]) {
            dp[i][j] = 1 + dp[i + 1][j + 1];
          } else {
            dp[i][j] = Math.max(
              dp[i + 1][j],
              dp[i][j + 1]
            );
          }
        }
      }

      const result = [];
      let i = 0;
      let j = 0;

      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) {
          result.push({
            type: "same",
            text: ylt[i]
          });

          i++;
          j++;
          continue;
        }

        const startI = i;
        const startJ = j;

        while (
          i < a.length &&
          j < b.length &&
          a[i] !== b[j]
        ) {
          if (dp[i + 1][j] >= dp[i][j + 1]) {
            i++;
          } else {
            j++;
          }
        }

        const yltPart = ylt.slice(startI, i);
        const webPart = web.slice(startJ, j);

        if (yltPart.length || webPart.length) {
          result.push({
            type: "different",
            ylt: yltPart.join(" "),
            web: webPart.join(" ")
          });
        }
      }

      // Handle any remaining sentences in either translation.
      if (i < a.length || j < b.length) {
        result.push({
          type: "different",
          ylt: ylt.slice(i).join(" "),
          web: web.slice(j).join(" ")
        });
      }

      return result;
    }

    function renderVerse(reference, yltText, webText) {
      const verse = makeElement("section", "verse");

      verse.appendChild(
        makeElement("div", "reference", reference)
      );

      // If one file lacks this verse, show the available text.
      if (yltText === undefined || webText === undefined) {
        verse.appendChild(
          makeElement("p", "sentence same", yltText ?? webText ?? "")
        );

        return verse;
      }

      for (const item of alignSentences(yltText, webText)) {
        if (item.type === "same") {
          verse.appendChild(
            makeElement("p", "sentence same", item.text)
          );

          continue;
        }

        const comparison = makeElement("div", "comparison");

        comparison.appendChild(makeConnector());

        if (item.ylt) {
          comparison.appendChild(
            makeElement("p", "sentence ylt", item.ylt)
          );
        }

        if (item.web) {
          comparison.appendChild(
            makeElement("p", "sentence web", item.web)
          );
        }

        verse.appendChild(comparison);
      }

      return verse;
    }

    async function startReader() {
      try {
        const [ylt, web] = await Promise.all([
          loadBibleFile("./YLT.txt"),
          loadBibleFile("./WEB.txt")
        ]);

        const references = [
          ...new Set([...ylt.keys(), ...web.keys()])
        ];

        const fragment = document.createDocumentFragment();

        for (const reference of references) {
          fragment.appendChild(
            renderVerse(
              reference,
              ylt.get(reference),
              web.get(reference)
            )
          );
        }

        reader.replaceChildren(fragment);
      } catch (error) {
        reader.replaceChildren(
          makeElement("p", "error", error.message)
        );
      }
    }

    startReader();
  </script>
</body>
</html>
